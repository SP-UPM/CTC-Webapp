<script>
/* ============ CONTENT, GENERATED FROM THE GUIDEBOOK SOURCE ============ */
var CRIT = [{"n": "Evidence","q": "Can the student evaluate the source, the method that produced the evidence and its limits, and say what it cannot establish?","from": "Ability 1 - question norms, practices and opinions, applied to the evidence base of a claim."},{"n": "Framing and assumptions","q": "Can the student identify an assumption inside the framing, and explain what that framing makes invisible?","from": "Ability 1 again, applied to the framing that made the claim look settled."},{"n": "Own position","q": "Can the student identify the weakest point in their own conclusion, and revise, qualify or defend it?","from": "Ability 2 - reflect on one's own values, perceptions and actions."},{"n": "Warranted judgement","q": "Is the conclusion proportionate to the evidence, with the degree of confidence stated?","from": "Added by UPM so the analysis resolves into a decision. Also carries ability 3, take a position in the sustainability discourse."}];
var LEVELS = ["1 Limited","2 Developing","3 Proficient","4 Exemplary"];
var GENERIC = [["Repeats claims as given.","Questions a claim but does not interrogate the method that produced the evidence.","Evaluates the source, method and limits of the evidence.","Evaluates source, method and limits, and states what the evidence cannot establish."],["Accepts the question or claim as framed.","Recognises framing or assumptions but does not probe their consequences.","Identifies an assumption embedded within the framing.","Identifies the assumption and explains what the framing makes invisible."],["Asserts a position, or rejects competing positions without examining their own.","States a position with general reservations.","Identifies the weakest point in their own position.","Identifies the weakest point and responds through revision, qualification or reasoned defence."],["Reaches a conclusion the evidence does not adequately support.","Reaches a conclusion but does not account for the limitations it has already identified.","Reaches a conclusion proportionate to the evidence.","Reaches a proportionate conclusion and states the degree of confidence the evidence warrants."]];
var METHODS = [{"id": "M1","n": "Case-Based Learning","f": "Inquiry","do": "Analyse a real case whose evidence is incomplete, contested or points two ways.","sub": "A one-page case appraisal: what the evidence actually supports, the assumption inside the case framing, the weakest point of my own recommendation, and my judgement with the confidence the evidence warrants.","also": "Systems Thinking, Normative","conflict": "The two trials are chosen so neither is fraudulent and neither is decisive. The disagreement sits in the outcome measure and the population sampled, so it cannot be settled by deciding which paper is better.","run": "Two sessions of 90 minutes, three weeks apart. Session A appraises the evidence; independent reading between; session B produces the recommendation.","prompt": "State the weakest point in the recommendation you have just made, and what you did about it.","watch": "Marking the recommendation rewards the group that guessed the clinically fashionable answer. Mark the appraisal."},{"id": "M2","n": "Problem-Based Learning","f": "Inquiry","do": "Work an ill-structured problem, and interrogate the problem definition and the information base before solving it.","sub": "A reasoning log: the problem definition I proposed, what I later found the information base could not support, and how and why my definition changed.","also": "Systems Thinking, Collaboration","conflict": "The brief is written so that solving the problem as stated produces a defensible engineering answer to the wrong question. The fault is in the framing of the baseline, not in the calculation.","run": "Week 3 framing, week 6 interim reasoning log, week 9 revised definition, week 11 delivery.","prompt": "Which of your own early conclusions did the data pack not actually support, and when did you notice?","watch": "Teams that never revise the definition still produce a polished report. Require the interim log, dated, or the revision cannot be seen."},{"id": "M3","n": "Guided Inquiry","f": "Inquiry","do": "Generate the questions before being given the method, then test which of them the available evidence can answer.","sub": "My question set with a rationale for each, plus a note naming the question the available evidence cannot answer and why.","also": "Systems Thinking","conflict": "The evidence pack released afterwards is built so that it answers some of the students' questions well, some badly, and one not at all. Which is which is the finding.","run": "45 minutes generating questions, 45 minutes with the evidence pack, 30 minutes writing which questions survived.","prompt": "Name the question your evidence cannot answer, and say what conclusion you are therefore not entitled to draw.","watch": "Students write questions the pack obviously answers. Issue the pack only after the questions are submitted and time-stamped."},{"id": "M4","n": "Research-Method Critique","f": "Analytical","do": "Appraise a real study: design, sampling, measurement and the limits of the inference drawn from it.","sub": "A method critique: design, measurement quality, limits of inference, and one claim in the abstract the study cannot support.","also": "Systems Thinking","conflict": "The study is competently executed and its headline is still not warranted: the achievement measure was designed alongside the intervention. Nothing is wrong with the statistics.","run": "60 minutes individually with the paper, 30 minutes comparing critiques, 30 minutes writing.","prompt": "State one claim in the abstract that the study cannot support, and one claim of your own that your critique cannot support either.","watch": "A critique that only lists limitations is a checklist. Require the student to say which limitation actually changes the conclusion."},{"id": "M5","n": "Data and Model Interrogation","f": "Analytical","do": "Change one assumption inside a dataset or model and report how far the conclusion moves.","sub": "A sensitivity note: the assumption I changed, how far the conclusion moved, which assumption the headline depends on, and the confidence the result now warrants.","also": "Anticipatory, Systems Thinking","conflict": "The model is built so one unremarkable assumption — a deflator, a threshold, an aggregation level — carries most of the headline. The arithmetic is not in dispute at any point.","run": "30 minutes replication, 60 minutes sensitivity runs, 30 minutes writing the note.","prompt": "Which single assumption is your own conclusion most dependent on, and how confident does that let you be?","watch": "Students report that the result is robust because they varied only the parameters that do not matter. Require the load-bearing assumption to be named."},{"id": "M6","n": "Measurement and Field Critique","f": "Analytical","do": "Examine measurement, sampling and uncertainty in laboratory or field data the students generated or were given.","sub": "An interpretation note: what this measurement can and cannot establish, the uncertainty attached to my inference, and the strength of the conclusion I am entitled to draw.","also": "Systems Thinking","conflict": "The protocol is competent for the purpose it was written for, and does not support the claim now being made from it. The limitation is in the sampling frame, not in the instrument.","run": "Half a day of measurement or data handling, then 60 minutes writing the interpretation note.","prompt": "State the strength of conclusion this measurement entitles you to, and the point at which your own inference exceeds it.","watch": "Description is not interpretation. A note that reports the numbers accurately and draws no bounded conclusion is level 1 on criterion 4."},{"id": "M7","n": "Socratic Seminar","f": "Dialogue","do": "A rule-governed discussion of a difficult text, dataset or case, in which every position must be defended under questioning.","sub": "A post-seminar position paper: my position before the seminar, the challenge that had most force against it, and my position after, with reasons.","also": "Normative, Collaboration","conflict": "The source base is genuinely thin and partly one-sided, so a confident position cannot be defended by scholarship alone. Both a strong and a cautious reading survive the seminar.","run": "30 minutes preparation, 60 minutes seminar under rules, 30 minutes writing the revised position out of seminar.","prompt": "Which challenge in the seminar had most force against your position, and what did you change?","watch": "Fluent speakers dominate and are rewarded for it. The mark belongs to the written revision, not to performance in the room."},{"id": "M8","n": "Structured Academic Controversy","f": "Dialogue","do": "Argue a position, then argue against it, then revise or defend the position you actually hold.","sub": "A statement: the strongest argument on the side I did not start on, the weakest point in my own position, and my final judgement with its confidence.","also": "Collaboration, Normative","conflict": "The switch is compulsory, and a pair may not switch until the opposing pair accepts its restatement of their evidence as accurate. Both briefing packs are of equal quality.","run": "15 minutes preparation, 10 minutes each side, 10 minutes each side restating the other's evidence, 20 minutes switched, 20 minutes out of role, 15 minutes writing.","prompt": "State the weakest point in the position you actually hold, and whether you have revised it, qualified it or defended it.","watch": "The restatement step is where the competency lives, and it is the step cut when running late. Cut preparation instead. Never grade the position held."},{"id": "M9","n": "Devil's Advocate / Red Team","f": "Dialogue","do": "A rotating student or sub-team is required to attack the emerging consensus, including its evidence base.","sub": "The strongest objection raised against my own position, and my response to it — revision, qualification, or reasoned defence with grounds.","also": "Collaboration, Anticipatory","conflict": "The red team is given access to the same evidence and a specific instruction to find the load-bearing assumption. The recommendation cannot be defended by asserting good intentions.","run": "20 minutes red-team preparation, 40 minutes challenge, 30 minutes response, 20 minutes writing.","prompt": "Which objection did you find you could not answer, and what did you do about it?","watch": "Red teams reward cynicism if the brief is loose. Require every objection to name the evidence or assumption it attacks."},{"id": "M10","n": "Studio Critique and Revision","f": "Reflective","do": "Work is presented, critiqued against criteria at intervals, then revised — and the revision, not the final artefact, is what is assessed.","sub": "The revision made in response to critique, what in my own reasoning the critique exposed, and what I decided not to change and why.","also": "Self-awareness","conflict": "The critique panel is briefed to attack the evidence behind the sustainability claim in the scheme, not its drawing quality. A scheme that cannot justify its claim must change or defend itself with grounds.","run": "Week 4 first pin-up, week 7 second pin-up, week 9 submission of the revision record with both critiques attached.","prompt": "State what the critique exposed in your own reasoning, and what you decided not to change and why.","watch": "Students revise the drawing and not the reasoning. Require the revision record to cite the criterion the change answers."},{"id": "M11","n": "AI and Source Verification","f": "Verification","do": "Check a generated, secondary or promotional account against the primary sources and the method behind them.","sub": "A verification memo: what the account claimed, what the primary source actually says, what method produced it, and what I now conclude and how confidently.","also": "Self-awareness, Normative","conflict": "The account is accurate in most particulars and wrong where it matters: one figure is real but measured under conditions the account does not state. Plausibility is what makes it hard.","run": "20 minutes reading the account, 60 minutes verification against sources, 30 minutes writing the memo.","prompt": "After verification, state how confident your own conclusion is entitled to be, and what would change it.","watch": "Students grade the account rather than verify it. Require the primary source to be cited for every correction, and the uncorrected claims to be listed too."}];
</script>

<script>
var CLUSTERS = [{"n": "Health, Medical and Life Sciences","t": "Evidence for a clinical or public-health intervention","i": "Two published trials of the same intervention reach opposite conclusions. Neither is fraudulent; they differ in outcome measure and population sampled, so the disagreement cannot be settled by deciding which paper is better.","p": "M1 Case-Based Learning; M4 Research-Method Critique; M8 Structured Academic Controversy","a": "Students appraise two trials that disagree, holding funding, sampling and outcome measures; they critique the cohort study's exposure measurement; they argue a rationing proposition and are then required to argue against it before writing.","am": "Case appraisal and controversy cycle, plus an individual evidence appraisal memo","av": "Case appraisal and controversy cycle","s": "Individual evidence appraisal memo","o": "Evidence appraisal memo: the trials' methods, populations and what neither can establish; the assumption in the outcome measure and what it makes invisible; the weakest point in the student's own recommendation and what they did about it; the recommendation with the confidence the evidence warrants.","m": ["<strong>The two trials that disagree.</strong> Two published trials of the same intervention reach opposite conclusions; students hold both, with funding statements, sampling frames and outcome measures.","A ward-level problem stated as antibiotic overuse, where the data pack measures prescriptions but not indication.","Students write the questions they would need answered before accepting a screening programme's benefit claim.","A cohort study whose exposure was self-reported and whose follow-up lost a quarter of the sample.","A cost-effectiveness model in which the discount rate carries most of the headline result.","A laboratory result reported to three decimal places from an assay whose detection limit sits above the clinical threshold.","A seminar on rationing a scarce treatment, where every position must be defended under questioning.","A proposition on mandatory vaccination, argued, then argued against, then written.","A red team attacks the ward's own prescribing recommendation and its evidence base.","A patient information leaflet critiqued against readability and evidence criteria, then revised.","A generated summary of a treatment's benefit checked against the trial registry and the published protocol."],"r": [["Part (a), the appraisal of the two trials","Repeats the trials' conclusions as published.","Notes that the trials disagree but does not examine the outcome measures or populations that produced the disagreement.","Evaluates design, sampling and outcome measurement in both trials and states their limits.","Evaluates them and states what neither trial can establish about the patients in this ward."],["Part (b), the assumption in the framing","Accepts the question as the trials framed it: does the intervention work.","Notes that the outcome measure was chosen but does not say what follows from the choice.","Identifies the assumption inside the outcome measure — that the surrogate endpoint tracks the outcome patients care about.","Identifies it and explains what the surrogate makes invisible: harms that appear after the follow-up window closed."],["Part (c), the weakest point in the student's own recommendation","Asserts a recommendation, or rejects the opposing trial without examining their own reasoning.","States the recommendation with a general caution that evidence is limited.","Identifies the weakest point in their own recommendation — the population it extrapolates from.","Identifies it and responds: narrows the recommendation to the population sampled, or defends the extrapolation with stated grounds."],["Part (d), the closing judgement","Recommends adoption or rejection in terms the evidence does not support.","Reaches a recommendation but does not carry the limitations already identified into it.","Reaches a recommendation proportionate to the quality of the two trials.","Reaches a proportionate recommendation and states the confidence warranted, and the result that would change it."]]},{"n": "Sciences","t": "Environmental impact of a material or process","i": "A material is described as having lower environmental impact than the conventional alternative. The lifecycle boundary that produces the comparison excludes the stage where most of the impact sits.","p": "M3 Guided Inquiry; M5 Data and Model Interrogation; M7 Socratic Seminar","a": "Students write their questions before the evidence pack is released, then find which of them it cannot answer; they move the lifecycle boundary by one stage and record how far the comparison moves; a seminar requires each position to be defended under questioning and rewritten afterwards.","am": "Guided inquiry and sensitivity analysis, plus an individual scientific claim appraisal","av": "Guided inquiry and sensitivity analysis","s": "Individual scientific claim appraisal","o": "Claim appraisal: the method, uncertainty and limits of the impact evidence, and what it cannot establish; the system boundary assumed and what it places outside the comparison; the weakest point in the student's own conclusion and the revision or defence offered; a conclusion whose strength matches the uncertainty stated.","m": ["A contaminated-site file in which the analytical results and the remediation recommendation rest on different sampling campaigns.","A brief asking students to reduce a process's footprint, with a baseline measured on a boundary that excludes the largest source.","<strong>Questions before method.</strong> Students write the questions they would need answered about a material's sustainability claim before any evidence pack is issued to them.","An experimental paper whose control condition differs from the treatment in two respects, not one.","A lifecycle model in which moving the system boundary by one stage reverses the comparison.","Detection limits from four analytical methods for one contaminant, disagreeing exactly at the regulatory threshold.","A seminar on precaution versus managed use, where each position is questioned in turn.","A proposition on banning a substance, argued, then argued against, then written.","A red team attacks the group's own interpretation of its experimental result.","A public science output critiqued for what it claims beyond the data, then revised.","A manufacturer's environmental datasheet checked against the underlying lifecycle study and its stated boundary."],"r": [["The section appraising the impact evidence","Repeats the manufacturer's or paper's impact figure as given.","Questions the figure but does not examine the measurement or the lifecycle inventory that produced it.","Evaluates measurement method, uncertainty and the limits of the inventory.","Evaluates them and states what the study cannot establish — impacts in the stage the inventory excluded."],["The paragraph on the system boundary","Accepts the comparison as the datasheet framed it.","Notes that a boundary was drawn but does not probe its consequences.","Identifies the boundary assumption that makes the comparison favourable.","Identifies it and explains what it places outside the comparison, and that including it reverses the ranking."],["The paragraph on the weakest point of the student's own conclusion","Asserts a conclusion, or dismisses the manufacturer's claim without examining their own inference.","States the conclusion with a general caveat about uncertainty.","Identifies the weakest point in their own conclusion — the single study it rests on.","Identifies it and responds: qualifies the conclusion to the conditions tested, or defends the generalisation on stated grounds."],["The closing conclusion and its stated confidence","Concludes that the material is or is not preferable, without support.","Concludes but does not carry the uncertainty already identified into the wording.","Reaches a conclusion proportionate to the method quality and uncertainty.","Reaches a proportionate conclusion, states the confidence warranted, and names the measurement that would change it."]]},{"n": "Engineering","t": "A low-carbon technology selection","i": "A manufacturer states that the technology reduces lifecycle emissions by forty per cent. The figure is real, measured under conditions the datasheet does not state, and an independent study of the same technology reports half of it.","p": "M4 Research-Method Critique; M11 AI and Source Verification; M9 Devil's Advocate / Red Team","a": "Students critique the performance study's test cycle against the duty cycle in service; they verify the vendor's forty per cent against the independent study and the test standard it cites; a red team is then briefed to attack their own recommendation and the assumption it rests on.","am": "Verification exercise and red-team challenge, plus an individual technical evidence brief","av": "Verification exercise and red-team challenge","s": "Individual technical evidence brief","o": "Technical evidence brief: the test standard, duty cycle and limits of the performance evidence, and what it cannot establish in service; the operating assumption inside the forty per cent and what it conceals; the objection the student could not answer and the revision or defence made; a specification recommendation whose confidence matches the evidence.","m": ["A failure investigation in which the maintenance log and the vendor's root-cause report support different conclusions.","<strong>The problem as stated is wrong.</strong> A client brief asks teams to cut process emissions, with a baseline measured on a boundary that excludes the largest source.","Students write the questions they would need answered before specifying a low-carbon technology.","A performance study whose test cycle does not resemble the duty cycle in service.","A lifecycle emissions model in which the assumed grid intensity carries the result.","Commissioning data from a plant, sampled over one week in one season, used to claim annual performance.","A seminar on a code change with significant cost implications, defended under questioning.","A proposition on mandating a technology standard, argued, then argued against.","A red team attacks the team's own technology recommendation and its evidence.","A design report critiqued for the evidence behind its sustainability claim, then revised.","A vendor datasheet checked against the independent lifecycle study and the test standard cited."],"r": [["Part (a), the appraisal of the performance evidence","Repeats the vendor's forty per cent as given.","Notes the disagreement with the independent study but does not examine the test standard or duty cycle behind either.","Evaluates the test standard, the measurement conditions and the limits of the inference to service.","Evaluates them and states what the test cannot establish — performance under the client's actual duty cycle."],["Part (b), the assumption inside the claim","Accepts the emissions comparison as the datasheet framed it.","Notes that assumptions were made but does not say what follows.","Identifies the operating assumption the forty per cent depends on — the assumed load factor or grid intensity.","Identifies it and explains what it conceals: the saving falls to the independent study's figure at the client's real load."],["Part (c), the objection the student could not answer","Asserts a specification, or dismisses the vendor without examining their own reasoning.","States the recommendation with a general note that data are limited.","Identifies the weakest point in their own recommendation, named by the red team.","Identifies it and responds: revises the specification, qualifies it to stated conditions, or defends it with grounds."],["Part (d), the recommendation and its stated confidence","Recommends the technology in terms the evidence does not support.","Recommends it but does not carry the limits already identified into the wording.","Reaches a recommendation proportionate to the evidence available.","Reaches a proportionate recommendation, states the confidence warranted, and names the commissioning measurement that would settle it."]]},{"n": "Computer Science and Information Technology","t": "An efficiency, fairness or data-centre sustainability claim","i": "A model is reported as both more accurate and less energy-intensive. The benchmark that produces the result was designed by the same team, and the energy figure counts inference but not training.","p": "M11 AI and Source Verification; M5 Data and Model Interrogation; M9 Devil's Advocate / Red Team","a": "Students verify a fluent generated account of a model's efficiency against the primary paper and its appendix; they recompute the fairness metric under a second reasonable definition and record how far the verdict moves; a red team is briefed to attack their own evaluation.","am": "Verification and sensitivity exercise, plus an individual benchmark critique memo","av": "Verification and sensitivity exercise","s": "Individual benchmark critique memo","o": "Benchmark critique memo: the benchmark design, dataset and metric, and what the benchmark cannot establish outside tested conditions; the assumption in the energy boundary and what it omits; the weakest point in the student's own evaluation and the response to it; a deployment judgement whose confidence matches the benchmark.","m": ["An incident file in which the logs and the post-mortem narrative support different causes.","A brief asking teams to reduce a service's energy use, with a baseline that counts inference only.","Students write the questions they would need answered before accepting a green-computing claim.","A benchmark paper whose test set overlaps its training data.","A fairness metric recomputed under a second reasonable definition, moving the verdict.","Energy telemetry sampled at the wrong interval to capture the peak it is used to rule out.","A seminar on algorithmic transparency, each position defended under questioning.","A proposition on content moderation or encryption, argued, then argued against.","A red team attacks the team's own model evaluation and its benchmark.","A system's sustainability claim critiqued against its measurement, then revised.","<strong>Check the confident answer.</strong> A fluent generated account of a model's efficiency is verified against the primary paper, its appendix and the hardware stated."],"r": [["The section appraising the benchmark","Repeats the reported accuracy and energy figures as given.","Questions the figures but does not examine the dataset, metric or hardware behind them.","Evaluates benchmark design, dataset provenance, metric and measurement method.","Evaluates them and states what the benchmark cannot establish outside the conditions tested."],["The paragraph on the energy boundary","Accepts the efficiency claim as the paper framed it.","Notes that a boundary was drawn but does not probe what follows.","Identifies the boundary assumption — training excluded from the energy count.","Identifies it and explains what it omits: amortised training dominates at this deployment's request volume."],["The paragraph on the weakest point of the student's own evaluation","Asserts a verdict, or dismisses the paper without examining their own method.","States the verdict with a general reservation about benchmarks.","Identifies the weakest point in their own evaluation — the single workload it was run on.","Identifies it and responds: reruns on a second workload, qualifies the verdict to that workload, or defends the generalisation with grounds."],["The closing deployment judgement","Recommends or rejects deployment in terms the benchmark does not support.","Reaches a judgement but does not carry the identified limits into it.","Reaches a judgement proportionate to the benchmark evidence.","Reaches a proportionate judgement, states the confidence warranted, and names the measurement in production that would change it."]]},{"n": "Mathematics and Statistics","t": "A headline statistic or a decision model","i": "An official figure reports that a deprivation indicator improved by six points. The arithmetic is correct throughout, and one unremarkable assumption inside the aggregation carries most of the improvement.","p": "M5 Data and Model Interrogation; M4 Research-Method Critique; M8 Structured Academic Controversy","a": "Students replicate a published headline, then change one stated assumption at a time and record how far it moves; they critique the survey's weighting scheme against the claim made in the abstract; they argue for an indicator, then against it, before writing.","am": "Sensitivity analysis and controversy cycle, plus an individual data interpretation memo","av": "Sensitivity analysis and controversy cycle","s": "Individual data interpretation memo","o": "Data interpretation memo: the source, weighting and limits of the statistic, and what it cannot establish; the aggregation assumption the headline depends on and what it makes invisible; the weakest point in the student's own estimate and the revision or defence offered; an interpretation whose strength matches the sensitivity found.","m": ["A district case file in which two defensible estimators produce different policy conclusions.","A brief asking students to model access to a service, where the available data measure attendance, not access.","Students write the questions they would need answered before accepting a published statistic.","A survey report whose response rate and weighting scheme are described in an appendix and not in the abstract.","<strong>Move one assumption.</strong> Students receive the model and data behind a published headline and change one stated assumption at a time, recording how far the headline moves.","A measurement series whose sampling interval cannot resolve the trend it is used to demonstrate.","A seminar on a disputed statistical adjustment in official reporting.","A proposition on which indicator should be official, argued, then argued against.","A red team attacks the student's own choice of estimator and aggregation.","A dashboard critiqued for what its uncertainty display supports, then revised.","A media account of a statistic checked against the source release and its technical notes."],"r": [["The section appraising the source statistic","Repeats the six-point improvement as published.","Questions the figure but does not examine the sampling, weighting or definitional change behind it.","Evaluates the instrument, sampling frame, weighting and limits of inference.","Evaluates them and states what the statistic cannot establish about the population it is quoted for."],["The paragraph naming the load-bearing assumption","Accepts the indicator as constructed.","Notes that assumptions exist inside the aggregation but does not probe them.","Identifies the aggregation or threshold assumption that carries the headline.","Identifies it and explains what it makes invisible: two districts move in opposite directions inside one improving average."],["The paragraph on the weakest point of the student's own estimate","Asserts an interpretation, or rejects the official figure without examining their own.","States the interpretation with a general note about uncertainty.","Identifies the weakest point in their own estimate — the assumption it is most sensitive to.","Identifies it and responds: reports a range instead of a point, or defends the point estimate on stated grounds."],["The closing interpretation and its stated confidence","Concludes that deprivation fell, or did not, without support.","Concludes but does not carry the sensitivity already found into the wording.","Reaches an interpretation proportionate to the sensitivity of the result.","Reaches a proportionate interpretation, states the confidence warranted, and names the data that would settle it."]]},{"n": "Education","t": "Evidence for the effectiveness of a teaching method","i": "A study reports that an intervention raised achievement by half a grade. The statistics are competent, and the achievement measure was designed alongside the intervention it evaluates.","p": "M4 Research-Method Critique; M10 Studio Critique and Revision; M8 Structured Academic Controversy","a": "Students appraise the study's instrument, comparison group and attrition; their draft recommendation is critiqued against published criteria and then revised; they argue a proposition on the method and are required to argue against it before writing.","am": "Method critique and critique-and-revision cycle, plus an individual evidence-based recommendation","av": "Method critique and critique-and-revision cycle","s": "Individual evidence-based recommendation","o": "Evidence-based recommendation: the study's design, measurement and limits, and the claims about learning it cannot support; the assumption in the achievement measure and what it makes invisible; the weakest point in the student's own recommendation and the revision made after critique; a recommendation whose confidence matches the evidence.","m": ["A school improvement file in which the attendance data and the attainment data support different explanations.","A brief asking students to raise attainment, with data that measure completion, not learning.","Students write the questions they would need answered before adopting a pedagogy.","<strong>The half-grade.</strong> Students appraise a real study reporting an achievement gain, holding the instrument, the comparison group and the attrition table.","An effect size recomputed with the attrited students imputed, moving the conclusion.","Classroom observation data collected in one term and used to claim a stable effect.","A seminar on streaming or medium of instruction, defended under questioning.","A proposition on standardised testing, argued, then argued against.","A red team attacks the student's own recommendation on a teaching method.","A learning resource critiqued for the evidence behind its claim, then revised.","A vendor's claim about an educational technology checked against the independent evaluation it cites."],"r": [["Part (a), the appraisal of the study","Repeats the half-grade gain as reported.","Notes limitations in general terms but does not examine the instrument or the comparison group.","Evaluates design, the achievement instrument, attrition and limits of inference.","Evaluates them and states which claims about learning the study cannot support."],["Part (b), the assumption in the achievement measure","Accepts achievement as the study defined it.","Notes that the measure was chosen but does not probe the consequence.","Identifies the assumption — that a measure built alongside the intervention tests learning rather than familiarity.","Identifies it and explains what it makes invisible: transfer to any task the intervention did not rehearse."],["Part (c), the weakest point in the student's own recommendation","Asserts that the method should or should not be adopted.","States the recommendation with a general caution about evidence.","Identifies the weakest point in their own recommendation, named in the critique.","Identifies it and responds: narrows the recommendation, or defends it with stated grounds and a monitoring condition."],["Part (d), the recommendation and its stated confidence","Recommends adoption in terms the evidence does not support.","Recommends it but does not carry the identified limits into the wording.","Reaches a recommendation proportionate to the evidence.","Reaches a proportionate recommendation, states the confidence warranted, and names the evidence that would change it."]]},{"n": "Economics, Accounting, Business, Finance and Management","t": "An ESG, green-investment or sustainable-product claim","i": "A fund states that its holdings are aligned to net zero. The disclosed methodology counts scope 1 and 2 emissions, excludes scope 3, and treats purchased offsets as reductions.","p": "M9 Devil's Advocate / Red Team; M11 AI and Source Verification; M5 Data and Model Interrogation","a": "Students verify the fund's alignment claim against the assurance statement and the standard it cites; they recompute the valuation with a carbon price and record how far the case moves; a rotating red team then attacks their own recommendation and the assumption it rests on.","am": "Verification and red-team challenge, plus an individual ESG evidence appraisal memo","av": "Verification and red-team challenge","s": "Individual ESG evidence appraisal memo","o": "ESG evidence appraisal memo: the disclosed methodology, assurance level and limits of the emissions evidence, and what it cannot establish; the scope boundary assumed and what it excludes; the objection the student could not answer and the revision or defence made; an investment judgement stating the conditions under which it should change.","m": ["A failing-supplier file in which the audit report and the disclosure notes support different verdicts.","A brief asking students to improve a firm's sustainability performance, with data covering only owned operations.","Students write the questions they would need answered before accepting a net-zero alignment claim.","An ESG rating methodology whose weights are undisclosed and whose inputs are self-reported.","A valuation recomputed with a carbon price applied, moving the investment case.","Emissions data compiled from supplier questionnaires with a forty per cent response rate.","A seminar on fiduciary duty and sustainability, defended under questioning.","A proposition on mandatory scope 3 disclosure, argued, then argued against.","<strong>The team paid to break it.</strong> A rotating red team is briefed to attack the emerging investment recommendation and the assumption its case rests on.","An investment memo critiqued for the evidence behind its ESG claim, then revised.","A sustainability report's headline checked against the assurance statement and the reporting standard cited."],"r": [["The section appraising the disclosure","Repeats the fund's alignment statement as published.","Questions the statement but does not examine the assurance level or the reporting standard behind it.","Evaluates the disclosed methodology, the assurance level and the limits of self-reported inputs.","Evaluates them and states what the disclosure cannot establish about the portfolio's actual emissions."],["The paragraph on the scope boundary","Accepts alignment as the fund defined it.","Notes that scope 3 is excluded but does not say what follows.","Identifies the boundary assumption — offsets counted as reductions, scope 3 outside the count.","Identifies it and explains what it excludes: the majority of the portfolio's emissions sit in the category not counted."],["The paragraph on the objection the student could not answer","Asserts an investment view, or dismisses the fund without examining their own case.","States the view with a general reservation about disclosure quality.","Identifies the weakest point in their own recommendation, named by the red team.","Identifies it and responds: revises the recommendation, qualifies it, or defends it with grounds and a stated trigger."],["The closing investment judgement","Recommends or rejects the holding in terms the evidence does not support.","Reaches a judgement but does not carry the disclosure limits into it.","Reaches a judgement proportionate to the sustainability evidence available.","Reaches a proportionate judgement and states the confidence and the conditions under which the recommendation should change."]]},{"n": "Language, Literature and Communication","t": "Media framing of a sustainability issue","i": "Two reports of the same flood are factually accurate and allocate responsibility to different parties. The difference is carried by grammar and lexical choice, not by any disputed fact.","p": "M9 Devil's Advocate / Red Team; M4 Research-Method Critique; M7 Socratic Seminar","a": "Students compare two accurate reports of the same event and identify the choices that allocate responsibility; they critique the content analysis whose coding scheme was written by the author of its hypothesis; a red team attacks their own interpretation, and the position is rewritten after seminar.","am": "Comparative framing analysis with red-team challenge, plus an individual framing analysis","av": "Comparative framing analysis with red-team challenge","s": "Individual framing analysis","o": "Framing analysis: the source, method and limits of the evidence each report rests on, and what neither establishes; the framing choices that allocate responsibility and what they make less visible; the weakest point in the student's own interpretation and the revision or defence made; an interpretation whose strength matches the textual evidence.","m": ["A crisis communication file in which the agency statement and the community account describe the same warning differently.","A brief asking students to improve public understanding, where the audience data measure reach, not comprehension.","Students write the questions they would need answered before accepting a claim about public opinion.","A content analysis whose coding scheme was written by the author of the hypothesis.","A sentiment or readability score recomputed under a second reasonable operationalisation.","A comprehension survey administered only in the language of the original text.","A seminar on a contested reading of a text, each position defended under questioning.","A proposition on disclosure in crisis communication, argued, then argued against.","A red team attacks the student's own interpretation of the discourse.","A public statement critiqued for what its evidence supports, then revised.","A generated summary of a report checked against the report's own wording and method."],"r": [["The section appraising each report's evidence","Summarises what the two reports say.","Notes that the reports differ but does not examine the sourcing or the attribution behind either.","Evaluates the sources, the attribution practice and the limits of what each report can support.","Evaluates them and states what neither report establishes about the warning actually issued."],["The paragraph on the framing choices","Accepts the issue as one of the reports framed it.","Notes that language differs but does not probe the consequence.","Identifies the framing choices — agentless passives, nominalisation, order of attribution — that allocate responsibility.","Identifies them and explains what the framing makes less visible: the decision point at which the warning could have been issued."],["The paragraph on the weakest point of the student's own reading","Asserts a reading, or dismisses one report as biased without examining their own.","States the reading with a general acknowledgement of subjectivity.","Identifies the weakest point in their own interpretation — the passage it rests most heavily on.","Identifies it and responds: qualifies the reading, or defends it with a second line of textual evidence."],["The closing interpretation and its stated confidence","Concludes that one report is biased, without grounds proportionate to the evidence.","Concludes but does not carry the textual limits into the wording.","Reaches an interpretation proportionate to the textual evidence.","Reaches a proportionate interpretation, states its confidence, and names the evidence that would revise it."]]},{"n": "Sociology, Psychology and Human Development","t": "A survey-based claim about behaviour or well-being","i": "A survey reports that a community supports a relocation. The instrument offered no option for conditional support, and the sample was drawn from households already registered for compensation.","p": "M8 Structured Academic Controversy; M4 Research-Method Critique; M6 Measurement and Field Critique","a": "Students critique the questionnaire's construct validity and sampling frame; they examine what a register-based sample can and cannot represent; they argue the proposition, then must have their restatement of the opposing evidence accepted before switching sides and writing.","am": "Controversy cycle with instrument critique, plus an individual survey-claim appraisal","av": "Controversy cycle with instrument critique","s": "Individual survey-claim appraisal","o": "Survey-claim appraisal: the instrument, sampling and limits of inference, and what the survey cannot establish; the assumption inside the response options and what it makes impossible to express; the weakest point in the student's own interpretation and the revision or defence made; an interpretation proportionate to the instrument.","m": ["A community intervention file in which the funder's outcome data and the practitioner's case notes disagree.","A brief asking students to raise well-being, with data measuring service contacts, not outcomes.","Students write the questions they would need answered before accepting a survey's headline.","A questionnaire study whose construct is measured by a single item.","A regression recomputed with a plausible confounder added, moving the conclusion.","A sample drawn from a register that excludes the households the claim is about.","A seminar on a contested welfare proposition, defended under questioning.","<strong>Argue it, then argue against yourself.</strong> Groups of four split into two pairs on a contested empirical proposition, argue it, then switch sides before writing.","A red team attacks the student's own interpretation of the survey.","A research instrument critiqued for what it can support, then revised.","A news account of a psychological finding checked against the paper and its effect size."],"r": [["The section appraising the instrument and sample","Repeats the reported level of support.","Questions the survey but does not examine the instrument or the sampling frame.","Evaluates the instrument, the sampling frame and the limits of inference.","Evaluates them and states what the survey cannot establish — the view of households outside the compensation register."],["The paragraph on the response options","Accepts support as the survey defined it.","Notes that the options were fixed but does not probe the consequence.","Identifies the assumption inside the response set — that support is unconditional.","Identifies it and explains what it makes impossible to express: conditional support is recorded as support."],["The paragraph on the weakest point of the student's own interpretation","Asserts an interpretation, or rejects the survey as biased without examining their own.","States the interpretation with a general reservation about self-report.","Identifies the weakest point in their own interpretation, named in the controversy.","Identifies it and responds: qualifies the interpretation to the sample drawn, or defends it with a second source."],["The closing interpretation and its stated confidence","Concludes that the community does or does not support relocation, without support.","Concludes but does not carry the instrument's limits into the wording.","Reaches an interpretation proportionate to the instrument and sample.","Reaches a proportionate interpretation, states its confidence, and names the evidence that would change it."]]},{"n": "Architecture, Design, Built Environment and Construction","t": "A green-building or design certification claim","i": "A building is certified and is described as more sustainable in use. The certification scores modelled performance at design stage; measured performance after two years of occupation is not part of the assessment.","p": "M10 Studio Critique and Revision; M5 Data and Model Interrogation; M9 Devil's Advocate / Red Team","a": "Students rerun the thermal model with realistic occupancy and record how far the rating moves; the scheme's sustainability claim is pinned up and attacked by a red team against its evidence; the revision made between the two critiques is what is submitted.","am": "Critique-and-revision cycle with model interrogation, plus an individual design evidence brief","av": "Critique-and-revision cycle with model interrogation","s": "Individual design evidence brief","o": "Design evidence brief: the certification method, modelled inputs and limits of the performance evidence, and what it cannot establish in use; the occupancy assumption inside the rating and whose comfort it makes less visible; what the critique exposed in the student's own reasoning and the revision made; a judgement of how strongly the green claim is supported.","m": ["A retrofit file in which the energy model and the metered consumption disagree.","A brief asking teams to lower a building's operational impact, with a baseline taken from the design model.","Students write the questions they would need answered before accepting a certification claim.","A post-occupancy study whose sample of buildings was chosen by the certification body.","A thermal model rerun with realistic occupancy hours, moving the rating.","Monitoring data from one heating season used to claim annual performance.","A seminar on density, heritage and retrofit, defended under questioning.","A proposition on mandatory post-occupancy disclosure, argued, then argued against.","A red team attacks the studio's own sustainability claim and its evidence.","<strong>The revision is the submission.</strong> Work is pinned up and critiqued against published criteria at two intervals, and the revision made between them is what is assessed.","A certification scorecard checked against the standard's own technical manual."],"r": [["The section appraising the certification evidence","Repeats the certification rating as awarded.","Questions the rating but does not examine the modelling method or the inputs behind it.","Evaluates the certification method, the modelled inputs and the limits of inference to performance in use.","Evaluates them and states what the certification cannot establish: measured performance under real occupation."],["The paragraph on the occupancy assumption","Accepts sustainability as the certification framed it.","Notes that assumptions were modelled but does not probe them.","Identifies the occupancy or schedule assumption the rating depends on.","Identifies it and explains whose experience it makes less visible: occupants whose hours the model did not represent."],["The revision record, read against both critiques","Revises the drawing, or rejects the certification without examining the student's own claim.","Records a revision with a general note that the critique was useful.","Identifies what the critique exposed in their own reasoning and revises accordingly.","Identifies it, revises, and states what they decided not to change and the grounds for that decision."],["The closing judgement on the green claim","Concludes that the building is or is not sustainable, without support.","Concludes but does not carry the modelling limits into the wording.","Reaches a judgement proportionate to the performance evidence available.","Reaches a proportionate judgement, states its confidence, and names the post-occupancy measurement that would settle it."]]},{"n": "Agriculture, Forestry, Aquaculture, Veterinary, Environmental and Food Sciences","t": "A sustainable production, yield or food-security claim","i": "A practice is reported to raise yield and improve soil carbon. The soil sampling stopped at fifteen centimetres, and the trial covered two seasons in one rainfall regime.","p": "M6 Measurement and Field Critique; M4 Research-Method Critique; M9 Devil's Advocate / Red Team","a": "Students interpret field data against the sampling protocol, depth and seasons covered; they critique the trial's randomisation and its shared control drainage; a red team attacks their own interpretation and the inference it rests on.","am": "Field measurement critique with red-team challenge, plus an individual field evidence appraisal","av": "Field measurement critique with red-team challenge","s": "Individual field evidence appraisal","o": "Field evidence appraisal: the sampling protocol, uncertainty and limits of the field evidence, and what it cannot establish; the assumption in the sampling depth and what it excludes from the carbon balance; the weakest point in the student's own inference and the response to it; a recommendation naming what remains uncertain.","m": ["A land-use file in which the yield data and the biodiversity survey support different recommendations.","A brief asking students to raise farm sustainability, with records covering output but not input losses.","Students write the questions they would need answered before accepting a practice's carbon claim.","A field trial whose plots were not randomised and whose control shared a drainage line.","A carbon balance recomputed to thirty centimetres depth, moving the conclusion.","<strong>The sample that stopped too shallow.</strong> Students interpret field data on a sustainability indicator, holding the sampling protocol, the depth and the seasons covered.","A seminar on intensification versus extensification, defended under questioning.","A proposition on a certification requirement, argued, then argued against.","A red team attacks the student's own interpretation of the trial.","An extension advisory note critiqued for the evidence behind it, then revised.","An input supplier's yield claim checked against the trial report and its protocol."],"r": [["The section appraising the trial and sampling","Repeats the reported yield and carbon gains.","Questions the trial but does not examine randomisation, depth or seasons covered.","Evaluates the sampling protocol, randomisation, uncertainty and limits of inference.","Evaluates them and states what the trial cannot establish: carbon change below the sampled depth, or in another rainfall regime."],["The paragraph on the sampling assumption","Accepts soil carbon as the trial measured it.","Notes the sampling depth but does not say what follows.","Identifies the assumption — that change above fifteen centimetres represents the profile.","Identifies it and explains what it excludes: redistribution below the sampled depth, which can reverse the balance."],["The paragraph on the weakest point of the student's own inference","Asserts a recommendation, or dismisses the trial without examining their own inference.","States the recommendation with a general note about field variability.","Identifies the weakest point in their own inference, named by the red team.","Identifies it and responds: restricts the recommendation to the regime trialled, or defends the extension with stated grounds."],["The closing recommendation and what remains uncertain","Recommends the practice in terms the trial does not support.","Recommends it but does not carry the sampling limits into the wording.","Reaches a recommendation proportionate to the field evidence.","Reaches a proportionate recommendation, states its confidence, and names the additional evidence most capable of changing it."]]},{"n": "Law","t": "Environmental compliance and the standard of proof","i": "An operator states that it met its legal duty of care. The monitoring records satisfy the statutory standard, and the statutory standard does not require measurement of the pathway on which the harm is alleged.","p": "M4 Research-Method Critique; M9 Devil's Advocate / Red Team; M11 AI and Source Verification","a": "Students critique the expert report's protocol against the conclusions drawn from it; they verify a generated case summary against the judgment and its ratio; a red team attacks their own advice and the authority it rests on.","am": "Expert-evidence critique with red-team challenge, plus an individual advice note","av": "Expert-evidence critique with red-team challenge","s": "Individual advice note on the strength of the evidence","o": "Advice note: the expert methodology, monitoring records and limits of the evidence, and what it cannot establish about the pathway alleged; the assumption inside the statutory standard and what compliance therefore does not show; the weakest point in the student's own advice and the revision or defence offered; an assessment of prospects proportionate to the evidence.","m": ["A liability file in which the compliance record and the community's evidence support different findings.","A brief asking students to advise on exposure, where the available records measure compliance, not impact.","Students write the questions they would need answered before advising on the prospects of a claim.","An expert report whose methodology section describes a protocol its conclusions exceed.","A damages calculation recomputed on a second reasonable causation assumption.","Monitoring undertaken at the boundary, used to rule out exposure at the receptor.","A seminar on the burden of proof in environmental harm, defended under questioning.","A proposition on strict liability for environmental damage, argued, then argued against.","A red team attacks the student's own advice and the authority it rests on.","A draft advice note critiqued for the strength of its evidential claims, then revised.","A generated case summary checked against the judgment itself and its ratio."],"r": [["The section appraising the evidence","Repeats the operator's compliance record as establishing the duty was met.","Questions the record but does not examine the monitoring protocol or the expert methodology.","Evaluates the monitoring protocol, the expert methodology and the limits of the inference drawn.","Evaluates them and states what the evidence cannot establish: exposure on the pathway the standard does not require to be measured."],["The paragraph on the statutory framing","Accepts the question as compliance framed it.","Notes that the standard is limited but does not probe the consequence.","Identifies the assumption — that compliance with the standard is evidence of absence of harm.","Identifies it and explains what the framing conceals: the standard was written for a different pathway, so compliance is silent on this one."],["The paragraph on the weakest point in the student's own advice","Asserts prospects, or attacks the operator's position without examining their own.","States the advice with a general reservation about evidential difficulty.","Identifies the weakest point in their own advice, named by the red team.","Identifies it and responds: qualifies the advice, or defends it with the authority most damaging to their own case addressed."],["The closing assessment of prospects","Advises that the claim will or will not succeed, without proportionate grounds.","Advises but does not carry the evidential limits into the wording.","Reaches an assessment proportionate to the evidence available.","Reaches a proportionate assessment, states the confidence warranted, and names the evidence that would change the advice."]]},{"n": "Arts and Humanities","t": "A contested historical or interpretive account","i": "A site's decline is attributed to climate. The surviving records are administrative and were produced by one party; the account most often cited rests on the archive that happens to have survived.","p": "M7 Socratic Seminar; M11 AI and Source Verification; M4 Research-Method Critique","a": "Students verify a fluent generated account of the site against the primary sources it cites; they critique the dating study whose uncertainty exceeds the change it explains; a rule-governed seminar requires each interpretation to be defended under questioning and rewritten afterwards.","am": "Seminar and source verification, plus an individual interpretive appraisal","av": "Seminar and source verification","s": "Individual interpretive appraisal","o": "Interpretive appraisal: the source base, its provenance and limits, and what the surviving record cannot establish; the assumption in the causal framing and whose account the archive makes invisible; the challenge in the seminar that had most force against the student's own position and what they changed; an interpretation proportionate to the sources.","m": ["An interpretation file in which the material evidence and the documentary record support different accounts.","A brief asking students to explain a decline, where the available sources record taxation, not population.","Students write the questions they would need answered before accepting a causal account.","A study whose dating method carries an uncertainty wider than the change it explains.","A chronology recomputed on a second defensible reading of the dating evidence.","A survey of one excavated quarter used to characterise a whole settlement.","<strong>Defend it, then write it again.</strong> A rule-governed seminar on a contested account of a site, object or text, in which every claim is answered under questioning and the position is rewritten afterwards.","A proposition on repatriation or reattribution, argued, then argued against.","A red team attacks the student's own interpretive claim and its source base.","An exhibition label critiqued for what its evidence supports, then revised.","A generated account of the site checked against the primary sources cited."],"r": [["The section appraising the source base","Repeats the accepted account of the decline.","Notes that sources are limited but does not examine their provenance or what they record.","Evaluates the provenance, the survival bias and the limits of what the record can support.","Evaluates them and states what the surviving archive cannot establish about the population it is used to describe."],["The paragraph on the causal framing","Accepts the question as the standard account framed it.","Notes that the framing is one of several but does not probe the consequence.","Identifies the assumption — that an administrative record tracks the population it taxes.","Identifies it and explains whose account the framing makes invisible: those who left no administrative trace."],["The post-seminar revision of the student's own position","Asserts an interpretation, or dismisses the standard account without examining their own.","States the position with a general acknowledgement of source limitations.","Identifies the challenge that had most force against their own position.","Identifies it and responds: revises the interpretation, or defends it with a second and independent line of evidence."],["The closing interpretation and its stated confidence","Concludes on the cause of decline in terms the sources do not support.","Concludes but does not carry the source limits into the wording.","Reaches an interpretation proportionate to the surviving evidence.","Reaches a proportionate interpretation, states its confidence, and names the evidence that would revise it."]]},{"n": "Hospitality, Tourism, Sport, Recreation and Services","t": "A sustainable tourism, event or destination claim","i": "A destination reports that its ecotourism programme benefits the local community. The benefit is measured as visitor spend at the gate; leakage to operators based elsewhere and the seasonality of the work are not counted.","p": "M5 Data and Model Interrogation; M4 Research-Method Critique; M9 Devil's Advocate / Red Team","a": "Students recompute the local-benefit figure with leakage and seasonality included and record how far it moves; they critique the visitor study whose sample was drawn at the entrance; a red team attacks their own impact assessment and the indicators it uses.","am": "Indicator interrogation with red-team challenge, plus an individual impact evidence memo","av": "Indicator interrogation with red-team challenge","s": "Individual impact evidence memo","o": "Impact evidence memo: the indicator, sampling and limits of the benefit evidence, and what it cannot establish; the assumption inside gate spend as a measure of local benefit and what it omits; the weakest point in the student's own assessment and the response to it; a judgement on the programme proportionate to the evidence.","m": ["A destination file in which the operator's revenue data and the residents' survey support different verdicts.","A brief asking students to raise local benefit, with data recording gate spend and not retained income.","Students write the questions they would need answered before accepting a community-benefit claim.","A visitor economy study whose sample was drawn at the attraction entrance.","A local-benefit figure recomputed with leakage and seasonality included.","Footfall counted in one peak month and annualised.","A seminar on carrying capacity, each position defended under questioning.","A proposition on a visitor cap, argued, then argued against.","A red team attacks the student's own impact assessment and its indicators.","A destination plan critiqued for the evidence behind its benefit claim, then revised.","A certification body's sustainability claim checked against its criteria document."],"r": [["The section appraising the benefit evidence","Repeats the reported community benefit figure.","Questions the figure but does not examine the indicator or the sampling point.","Evaluates the indicator, the sampling frame and the limits of inference.","Evaluates them and states what gate spend cannot establish about income retained locally."],["The paragraph on the benefit indicator","Accepts community benefit as the programme defined it.","Notes that the indicator is partial but does not say what follows.","Identifies the assumption — that visitor spend at the gate is income retained in the community.","Identifies it and explains what it omits: leakage to non-local operators, and work that disappears out of season."],["The paragraph on the weakest point of the student's own assessment","Asserts a verdict, or dismisses the programme without examining their own assessment.","States the verdict with a general reservation about data quality.","Identifies the weakest point in their own assessment, named by the red team.","Identifies it and responds: revises the indicator set, or defends the assessment with stated grounds."],["The closing judgement and its stated confidence","Concludes that the programme does or does not benefit the community, without support.","Concludes but does not carry the indicator's limits into the wording.","Reaches a judgement proportionate to the evidence available.","Reaches a proportionate judgement, states its confidence, and names the data that would change it."]]}];
</script>

<script>
var TESTS = [{"name": "The contestability test","q": "Could a well-informed person reach a different defensible conclusion from this evidence?","fail": "No","send": "Back to step 1. The claim is settled and the topic is a knowledge topic. Choose another week and start again."},{"name": "The recall test","q": "Could a well-prepared student answer this well from the notes?","fail": "Yes","send": "Back to step 3. The task specifies no reasoning moves. Name them, in the task, in writing."},{"name": "The inward test","q": "Does any clause require the student to examine the weakest point of their own conclusion?","fail": "No","send": "Back to step 4. Criterion 3 has nothing to point at, and it is the criterion nothing else in the programme covers. Add the clause."},{"name": "The one rule","q": "Could a student score full marks without using the competency?","fail": "Yes","send": "Back to step 4. The assignment is the problem, not the rubric. Fix the brief."},{"name": "The moderation test","q": "Do two markers agree within one level on every criterion?","fail": "No","send": "Stay in marking. Record a written clarification of how the descriptor is read; leave the criterion and the level names unchanged."}];
var C1A = [["Define sustainable development and explain its importance.","No","Definition and explanation are recall. The student reproduces the competency instead of using it."],["Critically discuss the benefits and drawbacks of solar energy.","No","&ldquo;Critically discuss&rdquo; names no reasoning move. A well-prepared student answers it from the lecture notes, which is the clearest breach of the one rule."],["Evaluate the evidence for the claim that Technology A has lower lifecycle impact, including how impact was measured and what the comparison excludes.","Yes","Criterion 1 at level 4, and criterion 2 in part. The measurement method and the exclusion are both named, so what the evidence cannot establish is markable."],["In groups, produce a report on sustainable building materials. Marks for scholarship, structure and presentation.","No","Scholarship, structure and presentation sit under other outcomes, and a group report contains no individual reasoning trace."],["State one limitation in your own conclusion and revise the strength of your recommendation accordingly.","Yes","Criterion 3 at level 4. The weakest point is named and acted on by revising the strength of the recommendation, which also produces criterion 4."],["Write an essay defining critical thinking and explaining why it matters for sustainability.","No","The student describes the competency instead of using it. The same fault as question 1, in a longer form."]];
var C1B = [["Shows that the study's detection limit sits above the threshold it is used to rule out.",1,"Evidence: the method producing the evidence cannot support the inference drawn from it."],["Points out that the comparison counts carbon only, and that water use disappears from the ranking as a result.",2,"Framing and assumptions: the definition of the problem makes one impact invisible."],["Writes that the recommendation now holds only for the population sampled, having previously stated it generally.",3,"Own position: the weakest point in the student's own conclusion is identified and the conclusion is narrowed in response."],["Concludes that the evidence supports the claim &ldquo;under the tested load conditions&rdquo; and not in general.",4,"Warranted judgement: the strength of the conclusion is bounded to what the evidence supports."]];
var C2 = [["&ldquo;Level 4: identifies four or more limitations in the evidence.&rdquo;","Levels separated by counting","Four limitations listed is not better reasoning than one limitation shown to change the conclusion."],["&ldquo;Level 3: good critical engagement with the sources.&rdquo;","An adjective instead of a descriptor","It tells the student nothing about what to do differently, and two markers will read it differently."],["&ldquo;Report is clearly written and correctly referenced.&rdquo; Should it carry PLO12?","No, it restates the brief","Keep it as a course mark, outside the four criteria and outside the attainment calculation."],["The brief asks students to evaluate the evidence, name an assumption and reach a judgement.","One criterion has no clause","Criterion 3 is missing. Add a clause requiring the weakest point in the student's own conclusion and the response to it. Amend the brief, not the rubric."],["The rubric awards level 4 to students who reached the conclusion supported by the most recent study.","Rewarding the right answer","Criterion 4 marks proportionality, not the verdict. Two students reaching opposite conclusions can both reach level 4."],["A single group report is the only submission.","Add an individual written submission","A group product cannot show one named student's reasoning. Only an individual submission lets the rubric be applied to a person."],["The four criteria are renamed to match the wording of this assignment.","The criterion names may not be changed","Attainment is added up across courses, so the four criteria and four levels must mean the same thing everywhere. Adapt the descriptors, never the names."],["The descriptors are copied unchanged from the generic rubric into a soil science course.","The descriptors were never adapted","Adaptation is required, not optional. A generic descriptor cannot be applied consistently by two markers."]];
var C3 = [["Engineering","Critically evaluate three low-carbon heating technologies and recommend one. Marks for technical accuracy, breadth of references and presentation.","No. Supply the datasheet and the independent study, and add a clause requiring the operating assumption the manufacturer's figure depends on to be named, and the weakest point of the student's own recommendation.","&ldquo;Critically evaluate&rdquo; with marks for breadth of references rewards volume. Nothing requires the method behind either figure to be interrogated."],["Health, Medical and Life Sciences","Summarise the evidence base for the intervention and state current best practice.","No. Replace &ldquo;summarise&rdquo; with an appraisal of the two trials that disagree, and require what neither can establish about this population.","A summary is recall, however current the sources. Best practice stated is someone else's judgement, not the student's."],["Education","Reflect on your own development as a critical thinker during this course.","No. Replace with four set prompts matching the four criteria, applied to a named claim and its evidence.","Unprompted reflection on one's own development produces sentiment. Criterion 3 requires the weakest point of a substantive conclusion, not a feeling about progress."],["Mathematics and Statistics","Individually, name the assumption the published headline figure depends on, and state how far the conclusion moves when it is changed.","Yes. Criterion 2 at level 4 and criterion 1 at level 3, reaching criterion 4 if it also states the confidence the result now warrants.","Individual, specific, and the load-bearing assumption is named rather than listed among others."],["Language, Literature and Communication","Compare the coverage of the event in two newspapers.","No. Require the choices that allocate responsibility to be named, what the framing makes less visible, and the weakest point in the student's own reading.","&ldquo;Compare&rdquo; can be answered descriptively. As written it evidences no criterion."],["Economics, Accounting, Business, Finance and Management","Prepare an ESG appraisal of the company and present it to the panel. Marks for analysis, professionalism and delivery.","No. Add four written clauses to the appraisal, and mark the written document rather than the presentation.","Professionalism and delivery sit under other outcomes, and an oral performance leaves no reasoning record two markers can score."]];
var AUDIT = ["The topic contains a genuinely contestable claim, written as one sentence","The CLO names the four reasoning moves, not just a verb","Exactly one primary SDG is claimed, and the content genuinely touches it","Students must interrogate how the evidence was produced or measured","Students must identify a meaningful assumption in the framing","Students must examine a weakness in their own position, and say what they did about it","A practice activity and a later assessed activity, with feedback between them","Four clauses in the brief, one per criterion","Four criteria and four levels, with descriptors adapted to this course, published with the brief","The attainment threshold declared, and the rubric not capped","A named second marker, and a calibration date before marking begins","The course file records the guidebook edition used"];
var MOD = ["Rubric published before submission, with descriptors adapted, date recorded","Two markers independently scored the same three scripts before marking began, and reconciled the evidence they used for each level","At least one of the three calibration scripts reaches a conclusion the marker disagrees with","Discrepancies discussed; descriptors clarified in writing, criteria and level names left unchanged","Ten per cent sample and all borderline cases second-marked","One anonymised exemplar retained per level, per criterion where possible","Any criterion on which two markers disagreed by more than one level flagged to the programme"];

<script>
/* ============ STATE ============ */
var SECTIONS = [
  {g:"Understand"},
  {id:"start",   ref:"00", nav:"Start here"},
  {id:"meaning", ref:"01", nav:"What it means"},
  {id:"criteria",ref:"02", nav:"The four criteria"},

];
