var store = {
  get:function(k,d){ try{ var v=localStorage.getItem("esdctc_"+k); return v===null?d:JSON.parse(v); }catch(e){ return d; } },
  set:function(k,v){ try{ localStorage.setItem("esdctc_"+k,JSON.stringify(v)); }catch(e){} }
};
var ci = store.get("cluster",0);
if(typeof ci!=="number" || ci<0 || ci>13) ci=0;
var seen = store.get("seen",[]);
if(!Array.isArray(seen)) seen=[];
var current = "start";
function C(){ return CLUSTERS[ci]; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ============ SECTION BUILDERS ============ */
function head(ref,eyebrow,title,lede){
  return '<div class="eyebrow">'+ref+' &middot; '+eyebrow+'</div><h2 class="title">'+title+'</h2><p class="lede">'+lede+'</p>';
}

function sec_start(){
  return head("Section 0","Start here","How to teach and assess Critical Thinking in your own course",
   "Work through the tabs in order. You will finish with one activity, one assignment and one rubric that are ready to use.")
  +'<div class="stack">'
  +'<div class="panel p-rule"><span class="tag">The one rule</span><p>If a student could score full marks <strong>without interrogating evidence, naming an assumption, examining their own weakest point and bounding their judgement</strong>, you have not assessed it. Every check on this site is a way of applying that rule earlier.</p></div>'
  +'</div>'
  +'<h3>What you will be able to do</h3>'
  +'<p class="body">The module has five learning outcomes. Each one is tied to a specific piece of work you will have produced by the end, recorded in <strong>My plan</strong>.</p>'
  +'<div class="tablewrap"><table><thead><tr><th>Outcome</th><th>On completion you can</th><th>Where</th></tr></thead><tbody>'
  +'<tr><td class="k"><span class="mlcode">ML01</span></td><td>Distinguish Critical Thinking from recall, description, opinion and scepticism.</td><td><button class="btn sm" data-goto="meaning">What it means &rarr;</button></td></tr>'
  +'<tr><td class="k"><span class="mlcode">ML02</span></td><td>Select and adapt a teaching method that develops Critical Thinking in your own course.</td><td><button class="btn sm" data-goto="methods">Choose a method &rarr;</button></td></tr>'
  +'<tr><td class="k"><span class="mlcode">ML03</span></td><td>Design an assignment that produces individual reasoning evidence.</td><td><button class="btn sm" data-goto="brief">The assignment &rarr;</button></td></tr>'
  +'<tr><td class="k"><span class="mlcode">ML04</span></td><td>Build the four-criterion rubric and adapt its descriptors to your discipline.</td><td><button class="btn sm" data-goto="rubric">The rubric &rarr;</button></td></tr>'
  +'<tr><td class="k"><span class="mlcode">ML05</span></td><td>Audit your own design against the ways an alignment claim fails.</td><td><button class="btn sm" data-goto="audit">Align and audit &rarr;</button></td></tr>'
  +'</tbody></table></div>'
  +'<div class="stack"><div class="panel p-step"><span class="tag">How the outcomes are evidenced</span><p>ML01 by the self-checks; ML02 to ML05 by the five worksheet sections of <strong>My plan</strong>. A completed plan is the record that you worked through the module.</p></div></div>'
  +'<h3>What is already decided for you</h3>'
  +'<div class="fixedrow">'
  +'<div><b>Your course</b><span>One you teach now</span></div>'
  +'<div><b>The primary SDG</b><span>Already selected</span></div>'
  +'<div><b>The competency</b><span>Critical Thinking</span></div>'
  +'<div><b>The CLO</b><span>Already mapped to PLO12</span></div>'
  +'</div>'
  +'<div class="stack"><div class="panel p-step"><span class="tag">What you decide</span><p>The contestable claim, the teaching activity, the assignment, and the rubric descriptors adapted to your discipline. That is all this site asks of you.</p></div></div>'
  +'<h3>Analysis is not Critical Thinking</h3>'
  +'<div class="grid g2">'
  +'<div class="card"><span class="n">Analysis</span><h5>Takes the question as given and answers it well</h5><p>A student who evaluates the options accurately, cites well and reaches a defensible answer has analysed. Most existing assignments stop here, and an assignment that stops here cannot evidence this competency.</p></div>'
  +'<div class="card accent"><span class="n">Critical Thinking</span><h5>Interrogates the question</h5><p>The student must ask how the evidence in front of them was produced, what the framing takes for granted, where their own conclusion is weakest, and how strong a judgement the evidence will actually bear.</p></div>'
  +'</div>'
  +'<div class="stack"><div class="panel p-warn"><span class="tag">The question an examiner asks</span><p>Not <em>did your students think critically</em>. They ask: <strong>which document shows a student examining the weakness of their own conclusion, and what mark did that earn?</strong></p></div></div>'
  +'<h3>How to use this site</h3>'
  +'<div class="stack tight">'
  +'<div class="panel"><p><strong>1 &middot; Pick your discipline cluster</strong> in the sidebar to customise the module to your cluster.</p></div>'
  +'<div class="panel"><p><strong>2 &middot; Work down the sidebar in order.</strong> Understand the competency, choose a method, write the brief, adapt the rubric, audit the result.</p></div>'
  +'<div class="panel"><p><strong>3 &middot; Fill in <em>My plan</em> as you go.</strong> It saves in this browser and can be copied into your course file at the end.</p></div>'
  +'</div>';
}

function sec_meaning(){
  var abil=[
   ["Question norms, practices and opinions","The claim, the evidence behind it and the framing that made it look settled must all be interrogated &mdash; not only the conclusion."],
   ["Reflect on one's own values, perceptions and actions","The scrutiny must be turned inward: the student's own conclusion must be shown to have a weakest point, and something must be done about it."],
   ["Take a position in the sustainability discourse","A judgement must actually be reached, and its strength must match the quality and limits of the evidence."]];
  var conf=[
   ["...is recall","The student reproduces information accurately. Accuracy is a knowledge outcome, and it is assessed elsewhere.","How was this information generated, and what can it support?"],
   ["...is opinion","A preference stated fluently is still a preference. Nothing in it can be placed on four levels except confidence.","What evidence, and what assumption, is that position resting on?"],
   ["...is scepticism","Rejecting everything requires no reasoning and is not scrutiny. Cynicism never turns on the cynic's own position.","Apply the same scrutiny to your own conclusion. Where is it weakest?"],
   ["...is the word &ldquo;critically&rdquo;","A verb in the task does not specify observable reasoning. &ldquo;Critically discuss&rdquo; is answerable from the lecture notes.","Which analytical moves must the student actually perform, and in writing?"],
   ["...is the correct conclusion","Complex sustainability problems support more than one defensible conclusion. Marking the verdict marks agreement with the lecturer.","Is the conclusion proportionate to the quality and limits of the evidence?"]];
  var h = head("Section 2","Understanding the competency","What Critical Thinking means",
    "Three abilities in the source definition, five confusions that appear in real course files, and one constraint that rules out most of the assessments you are already using.");
  h+='<div class="stack"><div class="panel p-def"><span class="tag">Definition &middot; UNESCO (2017)</span><em>Critical thinking competency: the ability to question norms, practices and opinions; to reflect on one\'s own values, perceptions and actions; and to take a position in the sustainability discourse.</em></div></div>';
  h+='<h3>The three abilities, and what each demands of student work</h3><div class="grid g3">';
  abil.forEach(function(a,i){ h+='<div class="card"><span class="n">Ability '+(i+1)+'</span><h5>'+a[0]+'</h5><p>'+a[1]+'</p></div>'; });
  h+='</div>';
  h+='<div class="stack"><div class="panel p-step"><span class="tag">The shift</span><p>From evaluating the answer to interrogating the question. A student who evaluates well but never asks how the evidence was produced, or never turns the same scrutiny on their own conclusion, has not yet demonstrated this competency.</p></div></div>';
  h+='<h3>What Critical Thinking is not</h3><div class="tablewrap"><table><thead><tr><th>Confusion</th><th>Why it fails</th><th>Ask instead</th></tr></thead><tbody>';
  conf.forEach(function(c){ h+='<tr><td class="k wrap">Critical Thinking '+c[0]+'</td><td>'+c[1]+'</td><td>'+c[2]+'</td></tr>'; });
  h+='</tbody></table></div>';
  h+='<h3>Which evidence can carry it</h3>';
  h+='<div class="fixedrow" style="grid-template-columns:repeat(3,minmax(0,1fr))">'
   +'<div style="border-top-color:var(--teal);background:var(--teal-tint)"><b>Cognitive</b><span>Reasoning about claims, evidence and inference &middot; main role</span></div>'
   +'<div><b>Socio-emotional</b><span>Reflecting on one\'s own position &middot; supporting role</span></div>'
   +'<div><b>Behavioural</b><span>Acting on a bounded judgement &middot; minor role</span></div></div>';
  h+='<div class="stack"><div class="panel"><p>Critical Thinking is mainly cognitive, with a socio-emotional element in criterion 3. That makes it the mirror image of Collaboration, and it changes where the design usually fails. Collaboration fails on <strong>attribution</strong>: a group produced the evidence and no mark can be given to a person. Critical Thinking rarely fails on attribution, because the reasoning is written by one student. It fails on <strong>demand</strong>: the task did not require the reasoning, so a well-prepared student scored full marks without doing any of it.</p></div>'
   +'<div class="panel p-warn"><span class="tag">Cannot provide sufficient evidence</span><p>A multiple-choice test, a recall examination, a &ldquo;critically discuss&rdquo; essay with no specified moves, a literature summary, and a group product with no individual reasoning trace. However the question is phrased, these produce knowledge evidence and no rubric repairs that.</p></div>'
   +'<div class="panel p-step"><span class="tag">The fix</span><p>The evidence must be a written record in which the student interrogates named evidence, names an assumption in the framing, identifies the weakest point in their own conclusion, and states a judgement whose strength matches what the evidence supports.</p></div></div>';
  return h;
}

function sec_criteria(){
  var h = head("Section 2.5","The rubric criteria","The four criteria",
    "The three abilities condense into three observable behaviours, and each becomes one rubric criterion. A fourth is added for what the student does with the analysis.");
  h+='<h3>The four criteria, one by one</h3>';
  h+='<div class="grid g2">';
  CRIT.forEach(function(c,i){ h+='<div class="card accent"><span class="n">Criterion '+(i+1)+'</span><h5>'+c.n+'</h5><p>'+c.q+'</p><p style="color:var(--ink-2);font-size:12.5px">'+c.from+'</p></div>'; });
  h+='</div>';
  h+='<div class="stack"><div class="panel p-note"><span class="tag">Numbering</span><p>Where Critical Thinking is the <strong>first</strong> competency in a course these are criteria 1 to 4. Where it is the <strong>second</strong>, they are numbered 5 to 8 in the alignment table. Always name the criterion as well as numbering it.</p></div></div>';
  h+='<h3>One claim, read through each criterion</h3><p class="body">The same claim, taken through the four criteria in turn. This is the example to use with students in week one.</p>';
  h+='<div class="stack"><div class="panel p-def"><span class="tag">The claim</span><em>Online learning is more environmentally sustainable than face-to-face learning.</em></div></div>';
  h+='<div class="tablewrap"><table><thead><tr><th>Criterion</th><th>What the student asks</th></tr></thead><tbody>'
   +'<tr><td class="k wrap"><span class="crit-n">1</span> Evidence</td><td>How was environmental impact measured? Were devices, data-centre energy and avoided transport all counted, and over what period? What does the study not measure at all?</td></tr>'
   +'<tr><td class="k wrap"><span class="crit-n">2</span> Framing and assumptions</td><td>Is sustainability being defined only as carbon? What becomes less visible under that framing &mdash; equipment lifecycles, e-waste, access, the emissions of a household heated all day?</td></tr>'
   +'<tr><td class="k wrap"><span class="crit-n">3</span> Own position</td><td>If I conclude that online learning has lower emissions, what is the weakest part of my conclusion &mdash; and do I now narrow it, qualify it, or defend it?</td></tr>'
   +'<tr><td class="k wrap"><span class="crit-n">4</span> Warranted judgement</td><td>Does the evidence justify &ldquo;always&rdquo;, &ldquo;usually&rdquo;, or only &ldquo;under these specified conditions&rdquo;? How confident am I entitled to be?</td></tr>'
   +'</tbody></table></div>'
   +'<div class="stack"><div class="panel p-warn"><span class="tag">Where most designs stop</span><p>A student who answers criteria 1 and 2 well and stops there has produced a critique. The competency is not complete until 3 and 4 are present: the scrutiny turned inward, and a bounded judgement actually reached. <strong>Criterion 3 is what separates critical thinking from cynicism</strong>, and almost nothing else in a curriculum assesses it.</p></div></div>';
  h+='<h3>The generic rubric</h3><p class="body">This wording is the starting point for every discipline. The four criteria, their names and the four level names never change. Only the descriptors are rewritten &mdash; see <strong>The rubric</strong>.</p>';
  h+='<div class="tablewrap"><table class="levels"><thead><tr><th>Criterion</th>';
  LEVELS.forEach(function(l){ h+='<th>'+l+'</th>'; });
  h+='</tr></thead><tbody>';
  CRIT.forEach(function(c,i){
    h+='<tr><td class="k wrap"><span class="crit-n">'+(i+1)+'</span><br>'+c.n+'</td>';
    GENERIC[i].forEach(function(d){ h+='<td>'+d+'</td>'; });
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  h+='<div class="stack"><div class="panel p-rule"><span class="tag">Fixed</span><p>Four criteria and their names. Four levels: Limited, Developing, Proficient, Exemplary. Do not add a fifth criterion, drop one, or rename a level.</p></div></div>';
  return h;
}

function sec_field(){
  var c=C();
  var h = head("Section 2.4 &amp; 3.4","Your discipline","Critical Thinking in "+c.n,
    "Critical Thinking cannot be practised on a problem with one right answer. Your course already contains a claim that is confidently made, supported by real but incomplete evidence, and open to more than one defensible reading.");
  h+='<div class="stack">'
   +'<div class="panel"><span class="tag" style="color:var(--ink-3)">Topic already taught</span><p style="font-size:17px;color:var(--ink);font-family:var(--serif)">'+c.t+'</p></div>'
   +'<div class="panel p-warn"><span class="tag">The contestable claim</span><p>'+c.i+'</p></div></div>';
  h+='<h3>Four questions to find your own claim</h3>'
   +'<div class="stack tight">'
   +'<div class="panel p-step"><p><strong>1</strong> &nbsp;Name one topic you already teach.</p></div>'
   +'<div class="panel p-step"><p><strong>2</strong> &nbsp;What claim about it is asserted confidently in industry, policy, the media or a textbook?</p></div>'
   +'<div class="panel p-step"><p><strong>3</strong> &nbsp;What evidence is offered for that claim, and how was that evidence produced?</p></div>'
   +'<div class="panel p-step"><p><strong>4</strong> &nbsp;Could a well-informed person reach a different defensible conclusion from the same evidence? State both conclusions in one sentence each.</p></div>'
   +'<div class="panel p-note"><p>If question 4 fails, the claim is settled and the topic is a knowledge topic &mdash; choose another week. If question 3 cannot be answered, you do not yet have evidence for students to interrogate: find the study, dataset, datasheet, report or record the claim actually rests on.</p></div></div>';
  h+='<h3>The worked design for this cluster</h3>'
   +'<div class="tablewrap"><table><tbody>'
   +'<tr><td class="k">Pedagogy</td><td>'+c.p+'</td></tr>'
   +'<tr><td class="k">Learning activities</td><td>'+c.a+'</td></tr>'
   +'<tr><td class="k">Assessment method</td><td>'+c.am+'</td></tr>'
   +'<tr><td class="k">Individual submission</td><td><strong>'+c.s+'</strong></td></tr>'
   +'</tbody></table></div>';
  h+='<h3>What that submission must contain</h3>'
   +'<div class="stack"><div class="panel p-step"><span class="tag">In criterion order 1, 2, 3, 4</span><p>'+c.o+'</p></div></div>';
  return h;
}

function sec_methods(){
  var c=C();
  var h = head("Section 3","Pedagogy","Choose a method",
    "Eleven methods, each written for your cluster. All eleven are a strong fit for Critical Thinking; that is why they are in the bank.");
  h+='<div class="stack"><div class="panel p-rule"><span class="tag">Three rules for any activity</span><ul>'
   +'<li><strong>Build the contestability in.</strong> If a well-prepared student can complete the task from the notes, or if the evidence points only one way, the activity develops nothing.</li>'
   +'<li><strong>Use two linked activities.</strong> Once produces a story. Twice, spaced, with focused feedback between, produces an ability.</li>'
   +'<li><strong>Turn the scrutiny inward.</strong> Something each student personally wrote about the weakest point of their own conclusion must survive the activity. Decide what it is before you run it.</li>'
   +'</ul></div>'
   +'<div class="panel p-warn"><span class="tag">Why rule three is the hard one</span><p>Students arrive fluent at criticising other people\'s work. An activity that ends at the critique of someone else\'s claim produces good evidence on criteria 1 and 2 and <strong>nothing at all on criterion 3</strong> &mdash; the criterion an external examiner looks for first, because no other outcome in the programme covers it. In practice criterion 3 needs someone else to attack the student\'s conclusion: the dialogue and reflective methods below produce it, the analytical ones on their own do not.</p></div></div>';
  h+='<h3>The method bank<span class="chip">'+c.n+'</span></h3>';
  var fams=["All","Inquiry","Analytical","Dialogue","Reflective","Verification"];
  h+='<div class="filters" role="group" aria-label="Filter by method family">';
  fams.forEach(function(f){ h+='<button class="btn sm fam-f" data-fam="'+f+'" aria-pressed="'+(f==="All")+'">'+f+'</button>'; });
  h+='</div><div class="stack" id="methodlist" style="margin-top:12px">';
  METHODS.forEach(function(m,i){
    h+='<div class="method" data-fam="'+m.f+'">'
     +'<button type="button" aria-expanded="false"><span class="mid">'+m.id+'</span><span class="mname">'+m.n+'</span><span class="fam">'+m.f+'</span><span class="chev">+</span></button>'
     +'<div class="spec"><dl>'
     +'<dt>What students do</dt><dd>'+m.do+'</dd>'
     +'<dt>In your cluster</dt><dd>'+c.m[i]+'</dd>'
     +'<dt>What makes it contestable</dt><dd>'+m.conflict+'</dd>'
     +'<dt>Run and timing</dt><dd>'+m.run+'</dd>'
     +'<dt>Required prompt</dt><dd>'+m.prompt+'</dd>'
     +'<dt>Individual evidence</dt><dd>'+m.sub+'</dd>'

     +'<dt>Also develops</dt><dd>'+m.also+'</dd>'
     +'</dl></div></div>';
  });
  h+='</div>';
  h+='<h3>Practice, then assessed</h3><p class="body">Rule 2 asks for two linked activities on the same topic. Only the second one is marked.</p>'
   +'<div class="tablewrap"><table><thead><tr><th>Arrangement</th><th>Practice &middot; week 5, no mark</th><th>Assessed &middot; week 9</th></tr></thead><tbody>'
   +'<tr><td class="k">In class only</td><td>M4 Research-Method Critique, 90 minutes in class</td><td>M8 Structured Academic Controversy on the assessed claim, 2 hours in class</td></tr>'
   +'<tr><td class="k wrap">With an external partner</td><td>M11 AI and Source Verification, 90 minutes</td><td>M9 Red Team challenge on each student\'s own recommendation with an external reviewer, half a day. Requires a partner agreement.</td></tr>'
   +'</tbody></table></div>'
   +'<div class="stack"><div class="panel p-warn"><span class="tag">Pair an analytical method with a dialogue method</span><p>Both arrangements do this deliberately: the analytical method produces criteria 1 and 2, and the dialogue method is what produces criterion 3. An arrangement built from two analytical methods will leave criterion 3 with nothing to mark.</p></div>'
   +'<div class="panel p-step"><span class="tag">What the feedback between them does</span><ol>'
   +'<li>After run one, students self-assess against the published rubric. Ten minutes, in writing.</li>'
   +'<li>You return one sentence naming the single criterion to work on. Not a grade. For most students in most cohorts that sentence will name criterion 3.</li>'
   +'<li>Run two uses a different claim and the identical rubric.</li>'
   +'<li>Only run two is marked. Run one carries no mark, and is the reason run two is usable.</li>'
   +'</ol></div></div>';
  return h;
}

function sec_design(){
  var h = head("Section 4","The design map","Design it, then test it",
    "Six steps from a claim to a reported mark, and five tests that stop a weak design from continuing.");
  h+='<h3>The six-step design workflow</h3>';
  var steps=[
   ["Identify the contestable claim","Choose a topic where real but incomplete evidence supports more than one defensible conclusion.","Your discipline"],
   ["Select the pedagogy","Choose methods that require learners to interrogate evidence, framing and their own position.","Choose a method"],
   ["Plan practice and assessment","Practice activity, then feedback, then assessed activity.","Choose a method"],
   ["Write the assessment brief","Ask for individual reasoning that matches the four criteria, one clause each.","The assignment"],
   ["Adapt the rubric descriptors","Rewrite each descriptor in the language of your task, and state where the marker looks.","The rubric"],
   ["Align, calibrate, moderate and report","Check alignment, calibrate before marking, second-mark a sample, then report PLO12 attainment.","Align and audit"]];
  var ch='<div class="chain">';
  steps.forEach(function(s,i){
    if(i) ch+='<div class="tick"><svg width="11" height="9" viewBox="0 0 11 9" aria-hidden="true"><path d="M5.5 9L0 0h11z" fill="currentColor"/></svg></div>';
    ch+='<div class="link"><div class="no">'+(i+1)+'</div><div class="txt"><b>'+s[0]+'</b><span>'+s[1]+'</span></div><div class="meta">'+s[2]+'</div></div>';
  });
  ch+='</div>';
  h+=ch;
  h+='<div class="stack"><div class="panel p-def"><span class="tag">Key idea</span><p>The design is only as strong as its weakest link. Build the learning activity, the assessment and the rubric as one connected system, not as three separate decisions.</p></div></div>';
  h+='<h3>The five tests</h3><p class="body">The tests are not steps. Answer each one about the design you have in mind. A failure sends you back to a step above rather than letting the design continue.</p>';
  h+='<div class="stack" id="testrunner">';
  TESTS.forEach(function(t,i){
    h+='<div class="q" data-i="'+i+'"><div class="qhead"><span class="qn">T'+(i+1)+'</span><span class="qtext"><strong>'+t.name+'</strong><br>'+t.q+'</span></div>'
     +'<div class="opts"><button class="btn sm t-ans" data-v="Yes">Yes</button><button class="btn sm t-ans" data-v="No">No</button></div>'
     +'<div class="fb"></div></div>';
  });
  h+='</div><div class="row"><button class="btn" id="testreset">Clear answers</button></div>';
  h+='<div class="stack"><div class="panel p-note"><span class="tag">Why the tests run in this order</span><p>Each test catches a fault the next step would hide. A settled claim produces a busy-looking activity; an activity answerable from recall produces a substantial-looking essay; an essay with no inward clause produces a mark that looks rigorous on three criteria and is silent on the fourth; and an assignment answerable without the competency produces a rubric that looks defensible until the scripts are read. Run them in order and none survives.</p></div></div>';
  return h;
}

function sec_brief(){
  var c=C();
  var h = head("Section 5.1 to 5.4","Designing the assessment","The assignment brief",
    "One assignment carries Critical Thinking. Write it in four clauses, one per criterion, on evidence the student has to actually read.");
  h+='<div class="grid g2">'
   +'<div class="card"><span class="n" style="color:var(--rose)">Assesses knowledge about the topic</span><h5 style="font-family:var(--serif);font-weight:400;font-style:italic">&ldquo;Critically discuss the sustainability of low-carbon heating technologies, with examples.&rdquo;</h5><p>A student who memorised the lecture and read nothing scores full marks. Nothing here supports four rubric levels except length and polish.</p></div>'
   +'<div class="card accent"><span class="n">Assesses the competency</span><h5 style="font-family:var(--serif);font-weight:400;font-style:italic">&ldquo;Using the manufacturer datasheet and the independent lifecycle study supplied, submit: (a) an appraisal of the test standard, measurement conditions and limits of the performance evidence, stating what it cannot establish in service; (b) one paragraph naming the operating assumption the forty per cent figure depends on, and what that assumption conceals; (c) one paragraph stating the objection to your own recommendation that you could not answer, and whether you have revised, qualified or defended it; (d) your specification recommendation with the degree of confidence the evidence warrants.&rdquo;</h5><p>Four clauses, four criteria. It cannot be started without reading both documents.</p></div>'
   +'</div>';
  h+='<h3>The four clause rule</h3>'
   +'<div class="tablewrap"><table><thead><tr><th>Clause</th><th>Criterion</th><th>What it must require</th></tr></thead><tbody>'
   +'<tr><td class="k">(a)</td><td class="k wrap"><span class="crit-n">1</span> Evidence</td><td>An appraisal of named evidence: its source, the method that produced it, its limits, and what it cannot establish.</td></tr>'
   +'<tr><td class="k">(b)</td><td class="k wrap"><span class="crit-n">2</span> Framing and assumptions</td><td>One assumption inside the framing, and what that framing makes invisible or hard to recognise.</td></tr>'
   +'<tr><td class="k">(c)</td><td class="k wrap"><span class="crit-n">3</span> Own position</td><td>The weakest point in the student\'s own conclusion, and the revision, qualification or reasoned defence that followed.</td></tr>'
   +'<tr><td class="k">(d)</td><td class="k wrap"><span class="crit-n">4</span> Warranted judgement</td><td>A judgement, with the degree of confidence the evidence warrants and what would change it.</td></tr>'
   +'</tbody></table></div>'
   +'<div class="stack"><div class="panel p-rule"><p>A <strong>criterion with no clause</strong> means students were never asked for that evidence, so its absence cannot be marked down. A <strong>clause with no criterion</strong> is work you asked for and will not mark.</p></div>'
   +'<div class="panel p-step"><span class="tag">The order matters</span><p>Clause (c) must come after (a) and (b) in the student\'s own writing, because a weakest point can only be named once a position has been taken. A brief that asks for reflection first produces sentiment; a brief that asks for it last produces evidence.</p></div></div>';
  h+='<h3>The CLO and the brief must name the same moves</h3>'
   +'<p class="body">The CLO arrives mapped to PLO12, but its wording is still yours, and a CLO written with a bare verb cannot be assessed against these four criteria.</p>'
   +'<div class="stack tight">'
   +'<div class="panel p-warn"><span class="tag">Weak</span><p>Understand sustainability claims in semiconductor manufacturing.</p></div>'
   +'<div class="panel p-note"><span class="tag">Better</span><p>Evaluate sustainability claims concerning semiconductor manufacturing.</p></div>'
   +'<div class="panel p-step"><span class="tag">Strong</span><p>Evaluate the evidence supporting a sustainability claim concerning semiconductor manufacturing by examining its source, method and limitations, identifying an assumption in its framing, addressing the weakest point of the student\'s own conclusion, and reaching a judgement proportionate to the evidence.</p></div>'
   +'<div class="panel"><p>Read your CLO and ask which of the four criteria a marker could point to in it. Fewer than four, and the missing criteria will have nothing to point at in the brief either.</p></div></div>';
  h+='<h3>The individual reasoning rule</h3>'
   +'<div class="stack"><div class="panel p-warn"><span class="tag">Two fixes that do not work</span><p>Adding the word <em>critically</em> to an existing task changes nothing. Raising the word limit measures stamina, and requiring more references measures volume.</p></div>'
   +'<div class="panel p-step"><span class="tag">Three that do</span><ul>'
   +'<li><strong>A four-clause appraisal.</strong> Two pages, one clause per criterion, on evidence the student had to actually read.</li>'
   +'<li><strong>A revision record.</strong> What the student changed in their own conclusion after challenge, and at whose prompting &mdash; this is where criterion 3 usually lives.</li>'
   +'<li><strong>A structured viva.</strong> Valid provided you mark the reasoning given under questioning, never the fluency of the delivery.</li>'
   +'</ul></div>'
   +'<div class="panel p-note"><span class="tag">In '+c.n+'</span><p>The individual submission for this cluster is the <strong>'+c.s+'</strong>, attached to: '+c.av.toLowerCase()+'.</p></div></div>';
  h+='<h3>Three traps when marking</h3>'
   +'<div class="tablewrap"><table><thead><tr><th>Trap</th><th>Looks like</th><th>Fix</th></tr></thead><tbody>'
   +'<tr><td class="k wrap">Marking the conclusion</td><td>The script that reaches the lecturer\'s own view scores highest; the well-reasoned opposite view scores lower.</td><td>Mark the proportionality of the reasoning. Two students reaching opposite conclusions can both reach level 4, and that is what makes the mark defensible.</td></tr>'
   +'<tr><td class="k">Marking fluency</td><td>A confident, well-structured, well-referenced report scores above a plainer one that actually interrogates the method.</td><td>Mark the named evidence, the named assumption, the named weakness. Presentation is assessed under other outcomes.</td></tr>'
   +'<tr><td class="k wrap">Marking objections by the yard</td><td>The student who lists nine limitations scores above the one who identifies the single limitation that changes the conclusion.</td><td>Mark whether the limitation identified is load-bearing, and whether the same scrutiny was turned on the student\'s own position.</td></tr>'
   +'</tbody></table></div>';
  h+='<h3>Placement, weight and threshold</h3>'
   +'<div class="stack"><div class="panel p-rule"><span class="tag">Four decisions</span><ol>'
   +'<li>Assess Critical Thinking through <strong>one</strong> component, not several. Split across three and none discriminates.</li>'
   +'<li>Weight it <strong>15 to 25 per cent</strong>. Below that band students under-invest and the evidence degrades.</li>'
   +'<li>Attainment is computed from the four criteria alone. Other criteria may carry course marks; state this in the outline.</li>'
   +'<li><strong>Mark all four levels.</strong> The rubric is not capped for Critical Thinking. The one capping rule applies to Integrated Problem-solving assessed mid-programme.</li>'
   +'</ol></div>'
   +'<div class="panel p-note"><p>The practice run and any group discussion are not marked for PLO12. They create the conditions; the individual submission carries the judgement. The week 5 run carries no mark at all.</p></div></div>';
  return h;
}

function sec_rubric(){
  var c=C();
  var h = head("Section 5.5 to 5.8","The rubric","The rubric, written for your task",
    "Four criteria, four levels, and descriptors you must rewrite in the language of your own discipline. Adapting the wording is required, not optional.");
  h+='<div class="stack"><div class="panel p-rule"><span class="tag">Fixed, and yours</span><p><strong>Fixed:</strong> four criteria and their names; four levels named Limited, Developing, Proficient, Exemplary; and the judgement each criterion captures.</p><p><strong>Yours:</strong> the wording of the descriptors. A descriptor that still says &ldquo;the evidence&rdquo; when your task is about a lifecycle study, a benchmark or a soil survey has not been adapted.</p><p>Attainment is added up across courses. That sum means something because the four criteria and the four levels mean the same thing in Law as in Engineering &mdash; not because the sentences are identical.</p></div></div>';
  h+='<h3>Worked rubric<span class="chip">'+c.n+'</span></h3>';
  h+='<p class="body">Judged from the <strong>'+c.s.toLowerCase()+'</strong>. The four criteria and level names are identical in every cluster; only the descriptor wording changes.</p>';
  h+='<div class="tablewrap"><table class="levels worked"><thead><tr><th>Criterion</th><th>Judged from</th>';
  LEVELS.forEach(function(l){ h+='<th>'+l+'</th>'; });
  h+='</tr></thead><tbody>';
  c.r.forEach(function(row,i){
    h+='<tr><td class="k wrap"><span class="crit-n">'+(i+1)+'</span><br>'+CRIT[i].n+'</td>';
    row.forEach(function(cell,j){ h+='<td'+(j===0?' style="color:var(--ink)"':'')+'>'+cell+'</td>'; });
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  h+='<h3>How to adapt it, in five steps</h3><div class="stack tight">';
  [["Keep the four criteria and their names unchanged.","Evidence; Framing and assumptions; Own position; Warranted judgement. Do not add a fifth, drop one, or reorder them."],
   ["Rewrite each descriptor in disciplinary language.","Name the actual study, the actual datasheet, the actual assumption in your task &mdash; not &ldquo;the evidence&rdquo;. The judgement the criterion captures stays the same; only the words change."],
   ["Write level 1 and level 4 first.","Level 1 is the commonest error, the floor. Level 4 is the exemplary move, the ceiling. Then split the quality gap to create levels 2 and 3."],
   ["Differentiate by quality of reasoning, not by counting.","One limitation shown to change the conclusion is level 4; three listed without that is level 3. Never &ldquo;three assumptions&rdquo; versus &ldquo;one&rdquo;."],
   ["Test each criterion against the one rule.","Could a student score full marks on it without using the competency? If yes, it is measuring writing or effort &mdash; rewrite it. If the brief has no clause asking for it, amend the brief."]
  ].forEach(function(s,i){ h+='<div class="panel p-step"><span class="tag">Step '+(i+1)+'</span><p><strong>'+s[0]+'</strong> '+s[1]+'</p></div>'; });
  h+='</div>';
  h+='<h3>Four faults in a rubric</h3>'
   +'<div class="tablewrap"><table><thead><tr><th>Fault</th><th>In a Critical Thinking rubric</th><th>Fix</th></tr></thead><tbody>'
   +'<tr><td class="k wrap">Adjectives instead of descriptors</td><td>Excellent critical thinking / good / fair / poor. This is a grading scale, not a behaviour-based rubric.</td><td>Describe the observable move, as in the generic rubric.</td></tr>'
   +'<tr><td class="k wrap">Levels separated by counting</td><td>&ldquo;Uses at least five references.&rdquo; &ldquo;Identifies three or more limitations.&rdquo; This measures volume, not quality of reasoning.</td><td>Separate levels by reasoning and by effect on the conclusion.</td></tr>'
   +'<tr><td class="k wrap">Criteria restating the brief</td><td>&ldquo;Report is well written and correctly referenced.&rdquo; This assesses report writing.</td><td>Keep it outside the four Critical Thinking criteria.</td></tr>'
   +'<tr><td class="k wrap">Rewarding the right answer</td><td>&ldquo;Reached the correct conclusion.&rdquo; Complex evidence supports more than one defensible conclusion.</td><td>Mark proportionality: does the strength of the conclusion match the evidence?</td></tr>'
   +'</tbody></table></div>'
   +'<div class="stack"><div class="panel p-warn"><span class="tag">Keep the four independent</span><p>If two criteria always rise and fall together, they are one criterion written twice. Name each criterion for the judgement it captures, never for a feature of the output: &ldquo;Own position&rdquo;, not &ldquo;the reflection paragraph&rdquo;.</p></div>'
   +'<div class="panel p-note"><span class="tag">The descriptor that was never adapted</span><p>If a descriptor still reads like a rule for all courses &mdash; &ldquo;level 4 always shows deeper critical engagement&rdquo; &mdash; it has not been adapted, and two markers will read it differently. If the same wording could be copied unchanged into another cluster, it is too general.</p></div></div>';
  return h;
}

  h+='<div class="stack"><div class="panel p-note"><p>Only the CLO is directly assessed; every other layer is a claim traceable through it. Criterion numbering is what makes the chain auditable: a reviewer follows a competency to a named criterion on a named rubric, and from there to one student&rsquo;s script.</p></div></div>';

   +'<div class="tablewrap"><table><thead><tr><th>When</th><th>What you do</th></tr></thead><tbody>'

  h+='<h3>Five ways an alignment claim fails</h3>'

   +'<tr><td class="k wrap">Competency named, not required</td><td>&ldquo;Critically&rdquo; appears in the CLO and no clause of any assignment requires a reasoning move. The commonest failure, invisible until the scripts are read.</td><td>The one rule</td></tr>'

}

   +'<div class="aistep"><span class="num">2</span><div class="txt">Press <strong>Copy AI prompt</strong>, then paste it into your AI assistant.</div></div>'
   +'<div class="aistep"><span class="num">3</span><div class="txt">Copy its whole reply, paste it in the box below and press <strong>Fill in my plan</strong>.</div></div>'
   +'<div class="row"><button class="btn primary" id="copyprompt">Show &amp; copy AI prompt</button>'
   +'<button class="btn" id="toggleai">Paste the reply</button></div>'
   +'<p class="ainote" id="aistatus" hidden></p>'
   +'<div class="aibox" id="promptbox" hidden>'
   +'<label for="aiprompt">Your prompt</label>'
   +'<textarea id="aiprompt" readonly></textarea>'
   +'<div class="row"><button class="btn" id="selectall">Select all</button>'
   +'<button class="btn" id="copyagain">Copy again</button>'
   +'<button class="btn" id="hideprompt">Hide</button></div></div>'
   +'<div class="aibox" id="aibox" hidden>'
   +'<label for="aireply">Paste the AI reply here</label>'
   +'<textarea id="aireply" placeholder="Paste the whole reply. Extra text around the JSON is fine."></textarea>'
   +'<div class="row"><button class="btn primary" id="fillplan">Fill in my plan</button></div></div>'
   +'<p class="ainote">Drafted fields are marked in amber. They are a starting point, not a finished plan '
   +'&mdash; read every line and change what does not fit your students. The mark clears once you edit a field.</p>'
   +'</div></div>';
  h+='<h3>Your assessment plan</h3>';
  h+='<div style="max-width:70ch">';
  fields.forEach(function(f){
    h+='<div class="field"><label for="p_'+f[0]+'">'+f[1]+'</label>'
     +(f[3]==="textarea"?'<textarea id="p_'+f[0]+'" class="pf" data-k="'+f[0]+'"></textarea>':'<input id="p_'+f[0]+'" class="pf" data-k="'+f[0]+'">')
     +(f[2]?'<span class="help">'+esc(f[2])+'</span>':'')+'</div>';
  });
  h+='</div>';
  h+='<div class="stack"><div class="panel p-rule"><span class="tag">Before you file it</span><ul>'
   +'<li>Could a well-informed person reach a different defensible conclusion from your evidence? If no, the claim is settled and the topic is a knowledge topic.</li>'
   +'<li>Could a well-prepared student answer this from the notes? If yes, the task specifies no reasoning moves.</li>'
   +'<li>Does any clause require the student to examine the weakest point of their own conclusion? If no, criterion 3 has nothing to point at.</li>'
   +'<li>Could a student score full marks without using the competency? If yes, fix the brief, not the rubric.</li>'
   +'</ul></div></div>';
  h+='<div class="row"><button class="btn primary" id="printplan">Print or save as PDF</button>'
   +'<button class="btn" id="copyplan">Copy my plan</button>'
   +'<button class="btn" id="clearplan">Clear all fields</button></div>';
  h+='<h3>Sources</h3>'
   +'<div class="tablewrap"><table><tbody>'
   +'<tr><td class="k">UNESCO (2017)</td><td>Education for Sustainable Development Goals: Learning Objectives. Source of the competency definition, the three learning domains and the conditions on assessment.</td></tr>'
   +'<tr><td class="k wrap">MQA (2024)</td><td>Malaysian Qualifications Framework, Second Edition. Source of the national mandate and the Global Sustainability Agenda.</td></tr>'
   +'<tr><td class="k">PEMACU ESD UPM</td><td><em>Teaching and Assessing the Eight ESD Competencies</em> (UPM ESD Guidebook), and SIM-ESD-CTC-01, Module: The Critical Thinking Competency.</td></tr>'
   +'</tbody></table></div>'
   +'<div class="stack"><div class="panel p-note"><p>Criteria 1 to 3 operationalise the three observable behaviours in the UPM ESD Guidebook, which render the abilities in the UNESCO definition. UNESCO states one ability where this rubric has two criteria &mdash; evidence and framing &mdash; and criterion 4, warranted judgement, was added by UPM so the analysis resolves into a decision. Four criteria, four named levels and the aggregation rule are UPM design decisions; do not present them as UNESCO requirements.</p></div></div>';
  return h;
}
</script>

<script>
/* ============ RENDER ============ */
var BUILD={start:sec_start,meaning:sec_meaning,criteria:sec_criteria,field:sec_field,methods:sec_methods,
           design:sec_design,brief:sec_brief,rubric:sec_rubric,audit:sec_audit,checks:sec_checks,plan:sec_plan};
var $=function(s,r){ return (r||document).querySelector(s); };
var $$=function(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };

function buildPicker(){
  var sel=$("#cluster");
  sel.innerHTML=CLUSTERS.map(function(c,i){ return '<option value="'+i+'"'+(i===ci?' selected':'')+'>'+(i+1)+'. '+c.n+'</option>'; }).join("");
  sel.addEventListener("change",function(){
    ci=parseInt(sel.value,10); store.set("cluster",ci);
    render(current);
    toast("Examples now written for "+CLUSTERS[ci].n);
  });
}
function buildNav(){
  var nav=$("#nav"), html="";
  SECTIONS.forEach(function(s){
    if(s.g){ html+='<div class="navgroup">'+s.g+'</div>'; return; }
    html+='<button class="navbtn" data-id="'+s.id+'"><span class="ref">'+s.ref+'</span><span>'+s.nav+'</span></button>';
  });
  nav.innerHTML=html;
  $$(".navbtn").forEach(function(b){
    b.addEventListener("click",function(){ go(b.dataset.id); });
  });
}
function markNav(){
  $$(".navbtn").forEach(function(b){
    b.classList.toggle("on", b.dataset.id===current);
    b.classList.toggle("done", seen.indexOf(b.dataset.id)>-1);
  });
  var n=seen.length, t=IDS.length;
  $("#progtext").textContent=n+" of "+t+" sections opened";
  $("#progbar").style.width=Math.round(n/t*100)+"%";
  var s=SECTIONS.filter(function(x){return x.id===current})[0];
  if(s) $("#mobwhere").textContent=s.nav;
}
function go(id){
  current=id;
  if(seen.indexOf(id)<0){ seen.push(id); store.set("seen",seen); }
  render(id);
  markNav();
  $("#rail").classList.remove("open");
  $("#menubtn").setAttribute("aria-expanded","false");
  window.scrollTo({top:0,behavior:"auto"});
}
function nextPrev(){
  var i=IDS.indexOf(current), out='<div class="jump">';
  if(i>0) out+='<button class="btn sm" data-goto="'+IDS[i-1]+'">&larr; '+SECTIONS.filter(function(s){return s.id===IDS[i-1]})[0].nav+'</button>';
  if(i<IDS.length-1) out+='<button class="btn sm primary" data-goto="'+IDS[i+1]+'">'+SECTIONS.filter(function(s){return s.id===IDS[i+1]})[0].nav+' &rarr;</button>';
  return out+'</div>';
}
function render(id){
  var m=$("#main");
  m.innerHTML='<section class="view on">'+BUILD[id]()
    +'<div class="pagefoot"><span>UPM ESD Series &middot; SIM-ESD-CTC-01 &middot; '+CLUSTERS[ci].n+'</span>'+nextPrev()+'</div></section>';
  var meta=SECTIONS.filter(function(x){return x.id===id})[0];
  var no=parseInt(meta.ref,10);
  $$("section.view h3",m).forEach(function(h,i){
    h.insertAdjacentHTML("afterbegin",'<span class="secnum">'+no+"."+(i+1)+'</span>');
  });
  $$("[data-goto]",m).forEach(function(b){ b.addEventListener("click",function(){ go(b.dataset.goto); }); });
  wire(id);
}

/* ============ WIRING ============ */
function toast(msg){
  var t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(function(){ t.classList.remove("show"); },2200);
}
function copyText(s){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(s).then(function(){ toast("Copied to clipboard"); },function(){ toast("Select the text and copy manually"); });
  } else { toast("Select the text and copy manually"); }
}

function wire(id){
  if(id==="methods"){
    $$(".method > button").forEach(function(b){
      b.addEventListener("click",function(){
        var p=b.parentNode, open=p.classList.toggle("open");
        b.setAttribute("aria-expanded",open?"true":"false");
        $(".chev",b).textContent=open?"−":"+";
      });
    });
    $$(".fam-f").forEach(function(f){
      f.addEventListener("click",function(){
        $$(".fam-f").forEach(function(x){ x.setAttribute("aria-pressed",String(x===f)); });
        var fam=f.dataset.fam;
        $$(".method").forEach(function(m){ m.style.display=(fam==="All"||m.dataset.fam===fam)?"":"none"; });
      });
    });
  }

  if(id==="design"){
    var ans={};
    function paint(){
      $$("#testrunner .q").forEach(function(q){
        var i=+q.dataset.i, t=TESTS[i], fb=$(".fb",q), v=ans[i];
        $$(".t-ans",q).forEach(function(b){ b.setAttribute("aria-pressed",String(b.dataset.v===v)); });
        if(!v){ fb.className="fb"; fb.innerHTML=""; return; }
        if(v===t.fail){ fb.className="fb show wrong"; fb.innerHTML="<b>Fails.</b> "+t.send; }
        else { fb.className="fb show right"; fb.innerHTML="<b>Passes.</b> Continue to the next test."; }
      });
    }
    $$(".t-ans").forEach(function(b){
      b.addEventListener("click",function(){
        ans[+b.closest(".q").dataset.i]=b.dataset.v; paint();
      });
    });
    $("#testreset").addEventListener("click",function(){ ans={}; paint(); });
  }

  if(id==="audit"){
    function outline(){
      var p=$("#f_partner").value.trim()||"[Competency B]";
      var s=$("#f_sdg").value.trim()||"[SDG n]";
      var w=$("#f_week").value.trim()||"[n]";
      var a=$("#f_act").value.trim()||"[n]";
      var sub=CLUSTERS[ci].s.toLowerCase();
      $("#outlinebox").innerHTML=
       '<p>This course implements Education for Sustainable Development. Two ESD competencies are developed and assessed: <strong>Critical Thinking</strong> and <mark>'+esc(p)+'</mark>. The primary Sustainable Development Goal is <mark>'+esc(s)+'</mark>.</p>'
      +'<p>CLOs mapped to PLO12 are assessed as follows. Critical Thinking is assessed through the '+sub+', week <mark>'+esc(w)+'</mark>, criteria 1&ndash;4. <mark>'+esc(p)+'</mark> is assessed through its own task, criteria 5&ndash;8. PLO12 attainment is computed from these criteria only. The rubric, with descriptors adapted to this course, is published in this outline and released with the brief. All four levels are marked.</p>'
      +'<p>Two conclusions may both be defensible on the evidence supplied. Marks are awarded for the quality and proportionality of reasoning, not for the conclusion reached.</p>'
      +'<p>The assessed reasoning activity runs in week <mark>'+esc(a)+'</mark>. That activity is not itself marked for PLO12; the individual submission carries the judgement.</p>';
    }
    ["f_partner","f_sdg","f_week","f_act"].forEach(function(k){
      var el=$("#"+k);
      el.value=store.get(k,"");
      el.addEventListener("input",function(){ store.set(k,el.value); outline(); });
    });
    outline();
    $("#copyoutline").addEventListener("click",function(){ copyText($("#outlinebox").innerText); });

    function list(host,items,key){
      var saved=store.get(key,[]);
      $(host).innerHTML=items.map(function(t,i){
        return '<label><input type="checkbox" data-i="'+i+'"'+(saved.indexOf(i)>-1?" checked":"")+'><span>'+t+'</span></label>';
      }).join("");
      $$(host+" input").forEach(function(cb){
        cb.addEventListener("change",function(){
          var on=$$(host+" input").filter(function(x){return x.checked}).map(function(x){return +x.dataset.i});
          store.set(key,on);
        });
      });
    }
    list("#auditlist",AUDIT,"audit");
    list("#modlist",MOD,"mod");
  }

  if(id==="checks"){
    var got={};
    function score(){
      var n=0; for(var k in got){ if(got[k]) n++; }
      $("#c1score").textContent=n+"/10";
    }
    $("#c1a").innerHTML=C1A.map(function(q,i){
      return '<div class="q" data-k="a'+i+'"><div class="qhead"><span class="qn">Q'+(i+1)+'</span><span class="qtext">'+q[0]+'</span></div>'
        +'<div class="opts"><button class="btn sm ans" data-v="Yes">Yes</button><button class="btn sm ans" data-v="No">No</button></div><div class="fb"></div></div>';
    }).join("");
    $("#c1b").innerHTML=C1B.map(function(q,i){
      var o="";
      for(var j=1;j<=4;j++) o+='<button class="btn sm ans" data-v="'+j+'">'+j+' &middot; '+CRIT[j-1].n+'</button>';
      return '<div class="q" data-k="b'+i+'"><div class="qhead"><span class="qn">Q'+(i+7)+'</span><span class="qtext">'+q[0]+'</span></div>'
        +'<div class="opts">'+o+'</div><div class="fb"></div></div>';
    }).join("");
    $$("#c1a .ans, #c1b .ans").forEach(function(b){
      b.addEventListener("click",function(){
        var q=b.closest(".q"), k=q.dataset.k, isA=k[0]==="a", i=+k.slice(1);
        var correct = isA ? C1A[i][1] : String(C1B[i][1]);
        var why = isA ? C1A[i][2] : C1B[i][2];
        var ok = b.dataset.v===correct;
        got[k]=ok; score();
        $$(".ans",q).forEach(function(x){ x.setAttribute("aria-pressed",String(x===b)); });
        var fb=$(".fb",q);
        fb.className="fb show "+(ok?"right":"wrong");
        fb.innerHTML="<b>"+(ok?"Correct.":"Not this one.")+" Answer: "+(isA?correct:"criterion "+correct)+".</b> "+why;
      });
    });
    score();
    $("#c1reset").addEventListener("click",function(){
      got={}; score();
      $$("#c1a .fb, #c1b .fb").forEach(function(f){ f.className="fb"; f.innerHTML=""; });
      $$("#c1a .ans, #c1b .ans").forEach(function(b){ b.setAttribute("aria-pressed","false"); });
    });
    $("#c2").innerHTML=C2.map(function(q,i){
      return '<div class="reveal"><button type="button"><span class="qn">Q'+(i+1)+'</span><span class="qt">'+q[0]+'</span><span class="chev">+</span></button>'
       +'<div class="ans"><p class="verdict">'+q[1]+'</p><p class="why">'+q[2]+'</p></div></div>';
    }).join("");
    $("#c3").innerHTML=C3.map(function(q,i){
      return '<div class="reveal"><button type="button"><span class="qn">Q'+(i+1)+'</span><span class="qt"><span class="cluster">'+q[0]+'</span><br>'+q[1]+'</span><span class="chev">+</span></button>'
       +'<div class="ans"><p class="verdict">'+q[2]+'</p><p class="why">'+q[3]+'</p></div></div>';
    }).join("");
    $$(".reveal > button").forEach(function(b){
      b.addEventListener("click",function(){
        var open=b.parentNode.classList.toggle("open");
        $(".chev",b).textContent=open?"−":"+";
      });
    });
  }

  if(id==="plan"){
    $$(".pf").forEach(function(el){
      el.value=store.get("plan_"+el.dataset.k,"");
      el.addEventListener("input",function(){ store.set("plan_"+el.dataset.k,el.value); });
    });
    $$(".pf").forEach(function(el){
      el.addEventListener("input",function(){ el.classList.remove("drafted"); });
    });

    $("#toggleai").addEventListener("click",function(){
      var b=$("#aibox"); b.hidden=!b.hidden;
      this.textContent=b.hidden?"Paste the reply":"Hide the paste box";
      if(!b.hidden) $("#aireply").focus();
    });

    function hardCopy(text){
      /* Throwaway element: does not depend on the state of the visible textarea,
         so it behaves the same on the first press and every press after. */
      var tmp=document.createElement("textarea");
      tmp.value=text;
      tmp.setAttribute("readonly","");
      tmp.style.cssText="position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;padding:0;border:0";
      document.body.appendChild(tmp);
      var ok=false;
      try{
        tmp.focus();
        tmp.select();
        tmp.setSelectionRange(0,text.length);
        ok=document.execCommand("copy");
      }catch(e){ ok=false; }
      document.body.removeChild(tmp);
      return ok;
    }

    function setStatus(msg){
      var s=$("#aistatus");
      if(s){ s.textContent=msg; s.hidden=!msg; }
    }

    function showPrompt(text){
      var ta=$("#aiprompt");
      ta.value=text;
      $("#promptbox").hidden=false;
      var sync=hardCopy(text);
      if(sync){
        setStatus("Copied. Paste it into your AI assistant.");
      } else {
        setStatus("Could not copy automatically. Press Select all below, then Ctrl+C (Cmd+C on Mac).");
      }
      if(!sync && navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){
          setStatus("Copied. Paste it into your AI assistant.");
        },function(){});
      }
      $("#promptbox").scrollIntoView({behavior:"smooth",block:"nearest"});
    }

    function plain(s){
      var d=document.createElement("div");
      d.innerHTML=String(s);
      return (d.textContent||"").replace(/\s+/g," ").trim();
    }

    function buildPrompt(){
      var c=C();
      var course=($("#p_course").value||"").trim();
      var topic=($("#p_topic").value||"").trim();
      if(!course||!topic){ toast("Fill in course and topic first"); return null; }
      var crit=CRIT.map(function(x,i){
        return (i+1)+". "+x.n+" — "+plain(x.q)+"\n   Proficient looks like: "+plain(GENERIC[i][2]);
      }).join("\n");
      return [
"You are helping a university lecturer design an assessment that measures the ESD Critical Thinking Competency.",
"Draft the missing parts of their assessment plan.",
"",
"CONTEXT",
"Course: "+course,
"Topic already taught: "+topic,
"Discipline cluster: "+plain(c.n),
"A contestable claim of the kind this cluster contains: "+plain(c.i),
"Suggested teaching methods: "+plain(c.p),
"Suggested activity shape: "+plain(c.a),
"Suggested individual submission: "+plain(c.s),
"The submission must show: "+plain(c.o),
"",
"THE FOUR CRITERIA THE PLAN MUST SERVE",
crit,
"",
"RULES",
"- The claim must be genuinely contestable: real but incomplete evidence supporting more than one defensible conclusion. If a well-informed person could not reach a different conclusion, it is a knowledge topic and too weak.",
"- Name the actual evidence students will interrogate: a study, dataset, datasheet, report or record, and how that evidence was produced.",
"- There must be a practice activity with feedback and no mark, then a separate assessed activity on a different claim using the same rubric. Pair an analytical method with a dialogue method, because the dialogue method is what produces criterion 3.",
"- One clause of the brief must require the student to examine the weakest point of their own conclusion and say what they did about it.",
"- The individual submission carries the mark, weighted 15 to 25 per cent, as one component only.",
"- Two opposite conclusions can both be excellent. Never reward the correct answer; reward proportionality.",
"- Write about "+topic+" specifically, not about the cluster in general.",
"- Plain sentences. No jargon the lecturer would have to decode.",
"",
"OUTPUT",
"Reply with ONLY a JSON object, no commentary, using exactly these keys:",
"{",
'  "claim": "the contestable claim in one sentence, in the form: X is claimed on the basis of Y, but Y was produced by Z, so a well-informed person could also conclude ...",',
'  "evidence": "the evidence students will interrogate, and how it was produced",',
'  "m1": "practice activity: method and week, e.g. M4 Research-Method Critique, week 5",',
'  "m2": "assessed activity: method and week, different claim, same rubric",',
'  "sub": "individual submission and length, e.g. Evidence appraisal memo, 800 words",',
'  "weight": "submission week and weight, e.g. Week 11, 20 per cent",',
'  "ca": "brief clause (a): the named evidence to appraise, its method, limits and what it cannot establish",',
'  "cb": "brief clause (b): the assumption inside the framing and what it makes invisible",',
'  "cc": "brief clause (c): the weakest point in the student\'s own conclusion and the revision, qualification or defence",',
'  "cd": "brief clause (d): the judgement with the confidence the evidence warrants and what would change it"',
"}"
      ].join("\n");
    }

    $("#copyprompt").addEventListener("click",function(){
      var p=buildPrompt();
      if(p) showPrompt(p);
    });
    $("#copyagain").addEventListener("click",function(){
      var p=buildPrompt();
      if(p) showPrompt(p);
    });
    $("#selectall").addEventListener("click",function(){
      var ta=$("#aiprompt");
      ta.focus();
      ta.select();
      try{ ta.setSelectionRange(0,ta.value.length); }catch(e){}
      setStatus("Selected. Now press Ctrl+C, or Cmd+C on a Mac.");
    });
    $("#hideprompt").addEventListener("click",function(){
      $("#promptbox").hidden=true;
      setStatus("");
    });

    $("#fillplan").addEventListener("click",function(){
      var raw=($("#aireply").value||"").trim();
      if(!raw){ toast("Paste the AI reply first"); return; }
      var s=raw.replace(/```json/gi,"").replace(/```/g,"");
      var a=s.indexOf("{"), b=s.lastIndexOf("}");
      if(a<0||b<a){ toast("No JSON found in that reply"); return; }
      var obj;
      try{ obj=JSON.parse(s.slice(a,b+1)); }
      catch(e){ toast("Could not read that reply. Ask the AI for JSON only."); return; }
      var keys=["claim","evidence","m1","m2","sub","weight","ca","cb","cc","cd"], n=0;
      keys.forEach(function(k){
        var el=$("#p_"+k);
        if(el && typeof obj[k]==="string" && obj[k].trim()){
          el.value=obj[k].trim();
          el.classList.add("drafted");
          store.set("plan_"+k,el.value);
          n++;
        }
      });
      if(!n){ toast("That reply had none of the expected fields"); return; }
      $("#aireply").value="";
      $("#aibox").hidden=true;
      $("#toggleai").textContent="Paste the reply";
      toast(n+" field"+(n===1?"":"s")+" drafted — now read and edit them");
      $("#p_claim").scrollIntoView({behavior:"smooth",block:"center"});
    });

    $("#printplan").addEventListener("click",function(){
      var c=C();
      var course=($("#p_course").value||"").trim();
      var d=new Date();
      var mon=["January","February","March","April","May","June","July",
               "August","September","October","November","December"][d.getMonth()];
      var out='<h1>Critical Thinking assessment plan</h1>'
        +'<p class="pmeta">'+esc(course||"Course not stated")+' &middot; '+c.n
        +'<br>SIM-ESD-CTC-01 &middot; Prepared '+d.getDate()+' '+mon+' '+d.getFullYear()+'</p>';

      $$(".pf").forEach(function(el){
        var lab=$('label[for="'+el.id+'"]');
        var name=lab?lab.textContent.replace(/\s+/g," ").trim():el.dataset.k;
        var v=(el.value||"").trim();
        out+='<div class="pitem"><p class="plab">'+esc(name)+'</p>'
           +(v?'<p class="pval">'+esc(v)+'</p>'
              :'<p class="pval pempty">Not completed</p>')+'</div>';
      });

      out+='<div class="pchecks"><h2>Before you file it</h2><ul>'
        +'<li>Could a well-informed person reach a different defensible conclusion from your evidence? If no, the claim is settled.</li>'
        +'<li>Could a well-prepared student answer this from the notes? If yes, the task specifies no reasoning moves.</li>'
        +'<li>Does any clause require the student to examine the weakest point of their own conclusion? If no, criterion 3 has nothing to point at.</li>'
        +'<li>Could a student score full marks without using the competency? If yes, fix the brief, not the rubric.</li>'
        +'</ul></div>'
        +'<p class="pfoot">PEMACU ESD, Universiti Putra Malaysia &middot; Critical Thinking Competency Workbench</p>';

      $("#printview").innerHTML=out;
      window.print();
    });

    $("#copyplan").addEventListener("click",function(){
      var out=["CRITICAL THINKING ASSESSMENT PLAN","Cluster: "+plain(CLUSTERS[ci].n),""];
      $$(".pf").forEach(function(el){
        var lab=$('label[for="'+el.id+'"]').textContent;
        out.push(lab.replace(/\s+/g," ").trim()+": "+(el.value||"—"));
      });
      copyText(out.join("\n"));
    });
    $("#clearplan").addEventListener("click",function(){
      $$(".pf").forEach(function(el){ el.value=""; el.classList.remove("drafted"); store.set("plan_"+el.dataset.k,""); });
      toast("Fields cleared");
    });
  }
}
